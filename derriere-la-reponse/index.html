C.ouv={
  title:'Comparer les modèles', color:'#3D5A80', tex:'t-open',
  sub:'Claude, GPT, Mistral, DeepSeek, Qwen, Apertus : ouverts ou fermés, à quel prix, avec quelles valeurs ?',
  steps:[
  {type:'info', title:'Deux façons de distribuer une IA',
   html:`<p>Un modèle d’IA, une fois entraîné, se résume à un énorme fichier de nombres&nbsp;: ses <b>poids</b>. Tout dépend de ce que l’entreprise fait de ce fichier.</p>
   <ul><li><b>Modèle fermé.</b> L’entreprise garde les poids. On utilise le modèle à distance, par une application ou par une <b>API</b> (un accès pour les programmes), en payant à l’usage. C’est le cas de Claude, des modèles GPT de ChatGPT ou de Gemini.</li>
   <li><b>Poids ouverts.</b> L’entreprise publie les poids. N’importe qui peut télécharger le modèle, le faire tourner sur ses propres machines et le modifier. C’est le cas de DeepSeek, de Qwen, de plusieurs modèles de Mistral.</li>
   <li><b>Entièrement ouvert.</b> En plus des poids, on publie les données et la méthode d’entraînement. C’est beaucoup plus rare. Le modèle suisse <b>Apertus</b>, publié en 2025 par l’EPFL, l’EPFZ et le centre de calcul de Lugano, en est un exemple.</li></ul>
   <p>«&nbsp;Poids ouverts&nbsp;» ne veut donc pas dire «&nbsp;open source&nbsp;» au sens strict&nbsp;: on peut utiliser le modèle sans savoir avec quoi il a été entraîné.</p>`,
   btn:'Trier les modèles'},

  {type:'sort', pts:10, title:'Ouvert ou fermé ?',
   q:'Peut-on télécharger ce modèle et le faire tourner sur ses propres machines&nbsp;?',
   buckets:[{id:'o',label:'Oui : poids ouverts'},{id:'f',label:'Non : modèle fermé'}],
   cards:[
    {t:'Claude (Anthropic, États-Unis)', b:'f', why:'Accessible uniquement par l’application ou l’API.'},
    {t:'Les modèles GPT de ChatGPT (OpenAI, États-Unis)', b:'f', why:'Les modèles phares d’OpenAI sont fermés.'},
    {t:'Gemini (Google, États-Unis)', b:'f', why:'Google publie à côté une famille ouverte plus petite, Gemma.'},
    {t:'DeepSeek (Chine)', b:'o', why:'Publié sous une licence très permissive. Son arrivée, début 2025, a surpris toute l’industrie.'},
    {t:'Qwen (Alibaba, Chine)', b:'o', why:'C’est la famille de modèles ouverts la plus téléchargée au monde.'},
    {t:'Mistral Small (Mistral AI, France)', b:'o', why:'Mistral, principal acteur européen, publie les poids de plusieurs de ses modèles.'},
    {t:'Apertus (EPFL, EPFZ et CSCS, Suisse)', b:'o', why:'Poids, données et méthode sont publics.'},
    {t:'gpt-oss (OpenAI, États-Unis)', b:'o', why:'Depuis 2025, OpenAI publie aussi des modèles à poids ouverts, moins puissants que ses modèles phares.'}],
   exp:`<p>Deux constats. D’abord, la frontière passe <b>à l’intérieur des entreprises</b>&nbsp;: OpenAI et Google publient des modèles ouverts tout en gardant leurs meilleurs modèles fermés.</p><p>Ensuite, les modèles ouverts les plus puissants viennent aujourd’hui surtout de <b>laboratoires chinois</b> (DeepSeek, Alibaba, Moonshot, Z.ai). Ils suivent les meilleurs modèles fermés avec quelques mois de retard.</p>`,
   src:'rapport ATOM sur les modèles ouverts (2026)&nbsp;; Epoch AI.'},

  {type:'match', pts:10, title:'Ce que chaque solution implique',
   q:'Associe chaque façon d’utiliser une IA à ce qu’elle implique.',
   pairs:[
    {a:'<b>Modèle fermé</b>, par API', b:'Rien à installer, mais les données partent chez le fournisseur, qui fixe les prix et les règles'},
    {a:'<b>Poids ouverts</b>, sur ses propres machines', b:'Les données restent sur place, mais il faut acheter et entretenir le matériel'},
    {a:'<b>Poids ouverts</b>, loués chez un hébergeur', b:'Bon marché et sans matériel à gérer, mais les données sortent quand même'},
    {a:'<b>Modèle entièrement ouvert</b>', b:'On peut examiner aussi les données et la méthode d’entraînement'}],
   exp:`<p>Le choix ne porte donc pas seulement sur la qualité du modèle, mais sur trois questions&nbsp;: <b>où vont mes données&nbsp;?</b> <b>De qui est-ce que je dépends&nbsp;?</b> <b>Qui paie le matériel&nbsp;?</b></p>`},

  {type:'cost', title:'Combien ça coûte ?',
   html:`<p>Les entreprises ne paient pas au mois mais au <b>token</b>, le petit morceau de texte que le modèle lit ou écrit. Un million de tokens représentent environ 700&nbsp;000 mots, soit une dizaine de romans. Les prix s’affichent en dollars par million de tokens, et ce que le modèle écrit coûte plus cher que ce qu’il lit.</p>
   <p>Déplace le curseur pour faire varier le nombre de tokens traités chaque jour par une entreprise, et compare la facture mensuelle.</p>`},

  {type:'mcq', pts:10, title:'Le seuil de rentabilité',
   q:'D’après le comparateur, quand un serveur local devient-il moins cher qu’une API&nbsp;?',
   opts:[
    {t:'Seulement à très gros volume régulier, et d’abord face aux modèles les plus chers.',ok:true},
    {t:'Toujours&nbsp;: une fois le serveur acheté, tout est gratuit.',why:'Le serveur, l’électricité et les personnes qui s’en occupent coûtent chaque mois, même s’il ne sert pas.'},
    {t:'Jamais, quel que soit le volume.',why:'À gros volume, le coût fixe est réparti sur beaucoup de tokens.'},
    {t:'Dès les premières requêtes.',why:'À petit volume, le coût fixe du serveur écrase tout.'}],
   exp:`<p>Un serveur local a un <b>coût fixe</b>&nbsp;: on le paie qu’il serve ou non. Une API a un <b>coût variable</b>&nbsp;: on ne paie que ce qu’on consomme. Le local ne gagne que si la machine travaille presque en permanence.</p><p>Face aux API les moins chères, il ne gagne presque jamais&nbsp;: les hébergeurs qui font tourner le même modèle ouvert pour des milliers de clients remplissent leurs machines bien mieux qu’une entreprise seule.</p>`,
   src:'tarifs publics des fournisseurs et études de coût d’hébergement (automne 2026).'},

  {type:'mcq', pts:10, title:'Alors pourquoi héberger soi-même ?',
   q:'Un hôpital choisit de faire tourner un modèle ouvert sur ses propres serveurs, alors qu’une API lui coûterait moins cher. Quelle est la raison la plus probable&nbsp;?',
   opts:[
    {t:'Les dossiers des patients ne doivent pas quitter l’hôpital, et il ne veut dépendre d’aucun fournisseur.',ok:true},
    {t:'Un modèle local est toujours plus intelligent.',why:'Les meilleurs modèles fermés gardent en général une longueur d’avance.'},
    {t:'Un serveur local ne consomme pas d’électricité.',why:'Il en consomme, et c’est l’hôpital qui la paie.'},
    {t:'Les API sont interdites en Suisse.',why:'Elles sont très utilisées, y compris en Suisse.'}],
   exp:`<p>Le prix n’est qu’un critère parmi d’autres. La <b>confidentialité</b> (données médicales, secrets industriels), l’<b>indépendance</b> (un fournisseur peut changer ses prix, ses règles, ou être soumis aux lois d’un autre pays) et la possibilité d’<b>adapter</b> le modèle pèsent souvent plus lourd.</p><p>En pratique, beaucoup d’organisations mélangent&nbsp;: un petit modèle local pour les tâches courantes ou sensibles, une API pour les tâches difficiles.</p>`},

  {type:'info', title:'Un modèle a-t-il des opinions ?',
   html:`<p>Les modèles ne diffèrent pas seulement par leur prix. Posez la même question délicate à plusieurs assistants&nbsp;: vous n’obtiendrez pas la même réponse.</p>
   <p>Un modèle n’a pas de convictions comme une personne. Mais ses réponses ont des <b>tendances</b>, qui viennent de trois sources&nbsp;:</p>
   <ul><li>ses <b>données</b> d’entraînement, surtout des textes en anglais écrits dans des pays riches&nbsp;;</li>
   <li>les <b>personnes</b> qui ont noté et corrigé ses réponses pendant l’entraînement&nbsp;;</li>
   <li>les <b>règles</b> écrites par l’entreprise, parfois avec l’aide de philosophes (dossier «&nbsp;Les données et leurs auteurs&nbsp;»).</li></ul>
   <p>Les chercheurs mesurent ces tendances de trois façons&nbsp;: des questions politiques, des dilemmes moraux, et la comparaison avec de grandes enquêtes menées auprès d’humains du monde entier.</p>`,
   btn:'Voir les résultats'},

  {type:'mcq', pts:10, title:'À gauche, à droite ?',
   q:'En juin 2026, le <i>Washington Post</i> pose une série de questions politiques américaines à six assistants et classe chaque réponse&nbsp;: arguments de gauche seulement, de droite seulement, ou les deux. Que trouve-t-il&nbsp;?',
   opts:[
    {t:'Tous donnent plus souvent des arguments de gauche que de droite, mais dans des proportions très différentes.',ok:true},
    {t:'Tous sont parfaitement neutres.',why:'Un seul des six présente presque toujours les deux points de vue.'},
    {t:'Les assistants présentés comme conservateurs penchent nettement à droite.',why:'Même eux donnent plus souvent des arguments de gauche que de droite.'},
    {t:'Chaque assistant défend le parti au pouvoir dans son pays.',why:'L’enquête ne montre rien de tel.'}],
   exp:`<p>Part des réponses qui ne donnent <b>que des arguments de gauche</b>&nbsp;:</p><div class="bars2"><div><span>GPT-5.5 (OpenAI)</span><span style="display:flex;align-items:center"><i style="width:80%"></i><b>80&nbsp;%</b></span></div><div><span>DeepSeek V4 Pro</span><span style="display:flex;align-items:center"><i style="width:70%"></i><b>70&nbsp;%</b></span></div><div><span>Arya (Gab)</span><span style="display:flex;align-items:center"><i style="width:50%"></i><b>50&nbsp;%</b></span></div><div><span>Claude Opus 4.8 (Anthropic)</span><span style="display:flex;align-items:center"><i style="width:43%"></i><b>43&nbsp;%</b></span></div><div><span>Grok 4.3 (xAI)</span><span style="display:flex;align-items:center"><i style="width:40%"></i><b>40&nbsp;%</b></span></div><div><span>Gemini 3.1 Pro (Google)</span><span style="display:flex;align-items:center"><i style="width:7%"></i><b>7&nbsp;%</b></span></div></div>
   <p>Gemini présente les deux points de vue dans 93&nbsp;% des cas, Claude dans 57&nbsp;%. Grok est celui qui donne le plus de réponses de droite, mais elles restent minoritaires.</p>
   <p>D’autres tests donnent d’autres classements. Dans une évaluation publiée par Anthropic fin 2025, Gemini, Grok et Claude obtiennent des notes d’équilibre voisines (94 à 97&nbsp;%), devant GPT-5 (89&nbsp;%) et Llama (66&nbsp;%). Mais c’est une entreprise qui note ses propres modèles et ceux de ses concurrents.</p>`,
   src:'Washington Post, 24 juin 2026, résumé par The Decoder&nbsp;; Anthropic, « Measuring political bias in Claude », novembre 2025.'},

  {type:'multi', pts:10, title:'Prudence avec ces classements',
   q:'Pourquoi faut-il lire ces résultats avec prudence&nbsp;?',
   opts:[
    {t:'La réponse d’un modèle change selon la façon dont la question est posée.',ok:true},
    {t:'«&nbsp;Gauche&nbsp;» et «&nbsp;droite&nbsp;» sont définies ici selon la politique américaine, pas suisse.',ok:true},
    {t:'L’entreprise peut déplacer les réponses en modifiant les consignes données au modèle.',ok:true},
    {t:'Une partie des tests sont réalisés par les entreprises elles-mêmes.',ok:true},
    {t:'Les modèles tirent leurs réponses politiques au hasard.'},
    {t:'Un modèle d’IA ne peut avoir aucune tendance, puisque c’est une machine.'}],
   exp:`<p>Les quatre premières raisons sont vraies.</p>
   <ul><li>Des chercheurs ont montré qu’un modèle forcé de choisir entre «&nbsp;d’accord&nbsp;» et «&nbsp;pas d’accord&nbsp;» ne répond pas comme lorsqu’il s’exprime librement&nbsp;: ils parlent de «&nbsp;girouette&nbsp;» plutôt que de «&nbsp;boussole&nbsp;».</li>
   <li>En 2025, le <i>New York Times</i> a montré que des changements de consignes avaient déplacé vers la droite les réponses de Grok à plus de la moitié de ses questions, surtout sur l’économie et l’État.</li>
   <li>Il existe une autre forme de couleur politique&nbsp;: les modèles chinois évitent ou refusent certaines questions sur la Chine (Tiananmen, Taïwan, Xinjiang).</li></ul>
   <p>À retenir&nbsp;: la tendance d’un modèle n’est pas un accident. Elle résulte de <b>choix</b>, que l’on peut mesurer et discuter.</p>`,
   src:'Röttger et al., ACL 2024&nbsp;; New York Times, septembre 2025&nbsp;; Pan et Xu, étude sur les modèles chinois.'},

  {type:'dilemma', key:'levier', title:'Que fais-tu ?',
   hint:'Pas de points en jeu, et pas de piège : réponds d’abord, on en discute juste après.',
   html:`<div class="fig" style="padding:8px"><svg viewBox="0 0 640 235" role="img" aria-label="Schéma : un tramway roule vers cinq personnes ; un levier permet de le dévier vers une voie où se trouve une personne." style="width:100%;height:auto;display:block"><path d="M15 160 H625" stroke="#47536E" stroke-width="6"/><path d="M250 160 C320 160 320 62 395 62 H625" stroke="#47536E" stroke-width="6" fill="none"/><rect x="30" y="116" width="92" height="38" rx="7" fill="#3D5A80"/><rect x="39" y="124" width="13" height="13" fill="#fff"/><rect x="59" y="124" width="13" height="13" fill="#fff"/><rect x="79" y="124" width="13" height="13" fill="#fff"/><rect x="99" y="124" width="13" height="13" fill="#fff"/><circle cx="50" cy="155" r="5" fill="#16213E"/><circle cx="102" cy="155" r="5" fill="#16213E"/><path d="M130 135 h34 m-8 -6 l8 6 l-8 6" stroke="#16213E" stroke-width="3" fill="none"/><path d="M232 190 l18 28" stroke="#16213E" stroke-width="5" stroke-linecap="round"/><circle cx="232" cy="190" r="6" fill="#C2571A"/><rect x="238" y="218" width="26" height="7" fill="#16213E"/><g stroke="#16213E" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="200" cy="197" r="6" fill="#16213E" stroke="none"/><path d="M200 204 v14 M192 209 h16 M200 218 l-7 11 M200 218 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="455" cy="125" r="6" fill="#B2304A" stroke="none"/><path d="M455 132 v14 M447 137 h16 M455 146 l-7 11 M455 146 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="485" cy="125" r="6" fill="#B2304A" stroke="none"/><path d="M485 132 v14 M477 137 h16 M485 146 l-7 11 M485 146 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="515" cy="125" r="6" fill="#B2304A" stroke="none"/><path d="M515 132 v14 M507 137 h16 M515 146 l-7 11 M515 146 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="545" cy="125" r="6" fill="#B2304A" stroke="none"/><path d="M545 132 v14 M537 137 h16 M545 146 l-7 11 M545 146 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="575" cy="125" r="6" fill="#B2304A" stroke="none"/><path d="M575 132 v14 M567 137 h16 M575 146 l-7 11 M575 146 l7 11"/></g><g stroke="#2A7656" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="515" cy="27" r="6" fill="#2A7656" stroke="none"/><path d="M515 34 v14 M507 39 h16 M515 48 l-7 11 M515 48 l7 11"/></g><text x="150" y="212" text-anchor="end" font-family="inherit" font-size="14" fill="#47536E">toi, près du levier</text><text x="515" y="186" text-anchor="middle" font-family="inherit" font-size="14" fill="#47536E">cinq personnes</text><text x="515" y="84" text-anchor="middle" font-family="inherit" font-size="14" fill="#47536E">une personne</text><text x="300" y="76" text-anchor="end" font-family="inherit" font-size="14" fill="#47536E">si tu tires le levier</text></svg></div>
   <ol><li>Un tramway sans freins roule vers <b>cinq personnes</b> bloquées sur la voie. Si rien ne change, elles vont mourir.</li>
   <li>Tu te trouves à côté d’un <b>levier</b> d’aiguillage. Tu ne peux ni les prévenir, ni arrêter le tramway.</li>
   <li>Si tu tires le levier, le tramway part sur une autre voie, où se trouve <b>une personne</b>. Elle mourra, alors qu’elle ne risquait rien.</li></ol>
   <p>Tu n’as que ces deux possibilités. <b>Que fais-tu&nbsp;?</b></p>`,
   opts:[
    {t:'Je tire le levier&nbsp;: une personne meurt, cinq sont sauvées.', out:'<p>C’est noté. Garde ta réponse en tête&nbsp;: voici une deuxième situation.</p>'},
    {t:'Je ne touche à rien&nbsp;: cinq personnes meurent, sans mon intervention.', out:'<p>C’est noté. Garde ta réponse en tête&nbsp;: voici une deuxième situation.</p>'}]},

  {type:'dilemma', key:'passerelle', title:'Et maintenant ?',
   hint:'Même règle : réponds d’abord, on en discute juste après.',
   html:`<p>Même tramway, mêmes cinq personnes. Mais cette fois, il n’y a pas de levier.</p><div class="fig" style="padding:8px"><svg viewBox="0 0 640 215" role="img" aria-label="Schéma : une passerelle passe au-dessus de la voie ; deux personnes s’y trouvent ; le tramway roule vers cinq personnes." style="width:100%;height:auto;display:block"><path d="M15 180 H625" stroke="#47536E" stroke-width="6"/><rect x="30" y="136" width="92" height="38" rx="7" fill="#3D5A80"/><rect x="39" y="144" width="13" height="13" fill="#fff"/><rect x="59" y="144" width="13" height="13" fill="#fff"/><rect x="79" y="144" width="13" height="13" fill="#fff"/><rect x="99" y="144" width="13" height="13" fill="#fff"/><circle cx="50" cy="175" r="5" fill="#16213E"/><circle cx="102" cy="175" r="5" fill="#16213E"/><path d="M130 155 h34 m-8 -6 l8 6 l-8 6" stroke="#16213E" stroke-width="3" fill="none"/><path d="M235 78 H405" stroke="#16213E" stroke-width="7"/><path d="M245 78 V180 M395 78 V180" stroke="#16213E" stroke-width="5"/><path d="M235 52 H405 M245 52 V78 M285 52 V78 M325 52 V78 M365 52 V78 M395 52 V78" stroke="#47536E" stroke-width="2"/><g stroke="#16213E" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="300" cy="43" r="6" fill="#16213E" stroke="none"/><path d="M300 50 v14 M292 55 h16 M300 64 l-7 11 M300 64 l7 11"/></g><g stroke="#2A7656" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="338" cy="43" r="6" fill="#2A7656" stroke="none"/><path d="M338 50 v14 M330 55 h16 M338 64 l-7 11 M338 64 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="455" cy="145" r="6" fill="#B2304A" stroke="none"/><path d="M455 152 v14 M447 157 h16 M455 166 l-7 11 M455 166 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="485" cy="145" r="6" fill="#B2304A" stroke="none"/><path d="M485 152 v14 M477 157 h16 M485 166 l-7 11 M485 166 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="515" cy="145" r="6" fill="#B2304A" stroke="none"/><path d="M515 152 v14 M507 157 h16 M515 166 l-7 11 M515 166 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="545" cy="145" r="6" fill="#B2304A" stroke="none"/><path d="M545 152 v14 M537 157 h16 M545 166 l-7 11 M545 166 l7 11"/></g><g stroke="#B2304A" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="575" cy="145" r="6" fill="#B2304A" stroke="none"/><path d="M575 152 v14 M567 157 h16 M575 166 l-7 11 M575 166 l7 11"/></g><text x="290" y="30" text-anchor="end" font-family="inherit" font-size="14" fill="#47536E">toi</text><text x="350" y="30" text-anchor="start" font-family="inherit" font-size="14" fill="#47536E">un inconnu</text><text x="515" y="206" text-anchor="middle" font-family="inherit" font-size="14" fill="#47536E">cinq personnes</text></svg></div>
   <p>Tu es sur une passerelle, au-dessus de la voie, à côté d’un inconnu très corpulent. Le seul moyen d’arrêter le tramway est de <b>pousser cet inconnu sur la voie</b>&nbsp;: il mourra, et les cinq seront sauvées.</p>
   <p><b>Que fais-tu&nbsp;?</b></p>`,
   opts:[
    {t:'Je pousse l’inconnu&nbsp;: il meurt, cinq sont sauvées.', out:'<p>C’est noté. Voyons maintenant ce que disent tes deux réponses.</p>'},
    {t:'Je ne le pousse pas&nbsp;: cinq personnes meurent.', out:'<p>C’est noté. Voyons maintenant ce que disent tes deux réponses.</p>'}]},

  {type:'debrief', title:'Ce que disent tes deux réponses', keys:['levier','passerelle'],
   rows:['Tirer le levier','Ne pas tirer le levier'], cols:['Pousser l’inconnu','Ne pas pousser'],
   cells:{
    '00':'<b>Compter jusqu’au bout.</b> Une vie contre cinq, dans les deux cas.',
    '01':'<b>La réponse la plus fréquente.</b> Oui au levier, non à la passerelle.',
    '10':'<b>Une réponse rare.</b> Non au levier, oui à la passerelle.',
    '11':'<b>Ne jamais tuer.</b> Aucune intervention, dans les deux cas.'},
   mine:{
    '00':'<p>Tu as tiré le levier <b>et</b> poussé l’inconnu. Tu appliques le même calcul dans les deux cas&nbsp;: une vie contre cinq. C’est la position utilitariste, tenue jusqu’au bout. Sur la passerelle, une personne sur deux seulement fait comme toi.</p>',
    '01':'<p>Tu as tiré le levier, <b>mais</b> refusé de pousser l’inconnu. C’est la réponse la plus fréquente. Pourtant le bilan est exactement le même&nbsp;: une vie contre cinq. Tu fais donc une différence entre dévier un danger et te servir d’une personne.</p>',
    '10':'<p>Tu n’as pas tiré le levier, <b>mais</b> tu as poussé l’inconnu. C’est une combinaison rare. Le bilan est le même dans les deux cas&nbsp;: demande-toi ce qui t’a fait changer d’avis.</p>',
    '11':'<p>Tu as refusé d’intervenir dans les deux cas. C’est la position déontologique&nbsp;: on ne tue pas un innocent, même pour en sauver cinq. Pour le levier, une personne sur cinq environ fait comme toi.</p>'},
   after:`<p>Tu viens de répondre à la plus célèbre <b>expérience de pensée</b> de la philosophie morale&nbsp;: une situation inventée, simplifiée exprès, pour isoler une seule question. Le tramway a été imaginé en 1967 par la philosophe Philippa Foot, la passerelle un peu plus tard par Judith Jarvis Thomson.</p>
   <p>Dans les deux situations, le bilan est le même&nbsp;: une vie contre cinq. Deux grandes façons de raisonner s’opposent.</p>
   <ul><li><b>L’utilitarisme</b> juge une action à ses conséquences&nbsp;: une mort vaut mieux que cinq, il faut intervenir. Objection&nbsp;: avec ce calcul, tout devient permis dès que le bilan est favorable.</li>
   <li><b>La déontologie</b> pose des interdits&nbsp;: on ne tue pas un innocent, quelles que soient les conséquences. Objection&nbsp;: ne rien faire est aussi un choix, et cinq personnes meurent.</li></ul>
   <p>Dans une enquête menée dans 42 pays, environ <b>quatre personnes sur cinq</b> tirent le levier, mais <b>une sur deux</b> seulement pousse l’inconnu. Pourquoi cette différence, si le bilan est le même&nbsp;? Avec le levier, la mort d’une personne est la conséquence malheureuse d’un geste qui dévie un danger. Sur la passerelle, cette personne est le <b>moyen</b> utilisé pour arrêter le tramway.</p>
   <p>Il n’y a pas de bonne réponse officielle. Mais ces deux questions font un bon test pour une IA&nbsp;: un modèle qui répond oui aux deux ne fait que compter&nbsp;; un modèle qui répond oui, puis non, fait la même différence que la plupart des humains.</p>`,
   btn:'Et les IA, que répondent-elles ?'},

  {type:'explore', title:'Quel modèle répond quoi ?',
   html:`<p>Des chercheurs de l’université de New York ont posé les deux questions, le levier puis la passerelle, à huit assistants. D’autres équipes ont répété des variantes du dilemme des centaines de fois. Voici ce que répond chaque modèle.</p>`,
   prompt:'Ouvre les six fiches.',
   items:[
    {label:'GPT', sub:'OpenAI&nbsp;: levier oui, passerelle non',
     html:`<p><b>Levier&nbsp;: oui.</b> Il faut réduire le mal total.<br><b>Passerelle&nbsp;: non.</b> Tuer volontairement un innocent est mal.</p><p>Mais tout dépend de la question. À «&nbsp;Dois-je tirer le levier&nbsp;?&nbsp;», le modèle GPT-4o ne répondait oui que dans 14 à 30&nbsp;% des essais, parce qu’il évitait souvent de donner un conseil. Avec une formulation neutre, il répondait oui dans 99&nbsp;% des cas.</p><p>Sur 480 essais de variantes, GPT-5 choisit de sauver le plus grand nombre dans <b>67&nbsp;%</b> des cas.</p>`},
    {label:'Claude', sub:'Anthropic&nbsp;: levier oui, passerelle non',
     html:`<p><b>Levier&nbsp;: oui.</b> C’est le moindre mal.<br><b>Passerelle&nbsp;: non.</b> Se servir d’une personne comme d’un instrument est bien plus grave que dévier un tramway.</p><p>Sur 480 essais de variantes, Claude choisit de sauver le plus grand nombre dans <b>41&nbsp;%</b> des cas&nbsp;: le taux le plus bas des quatre modèles testés. C’est celui qui s’écarte le plus souvent du simple calcul.</p>`},
    {label:'Gemini', sub:'Google&nbsp;: levier oui, passerelle oui',
     html:`<p><b>Levier&nbsp;: oui.</b> Il faut le plus grand bien-être possible.<br><b>Passerelle&nbsp;: oui.</b> Le bilan en vies est le même.</p><p>C’est le <b>seul des huit</b> à accepter de pousser l’inconnu. Dans ce test, il applique le calcul utilitariste jusqu’au bout.</p><p>Sur 480 essais de variantes, Gemini choisit de sauver le plus grand nombre dans <b>57&nbsp;%</b> des cas.</p>`},
    {label:'Grok', sub:'xAI&nbsp;: levier oui, passerelle non',
     html:`<p><b>Levier&nbsp;: oui.</b><br><b>Passerelle&nbsp;: non.</b> Pousser quelqu’un revient à commettre un meurtre.</p><p>Sur 480 essais de variantes, Grok choisit de sauver le plus grand nombre dans <b>76&nbsp;%</b> des cas&nbsp;: le taux le plus élevé des quatre modèles testés.</p>`},
    {label:'DeepSeek', sub:'Chine&nbsp;: levier oui, passerelle non',
     html:`<p><b>Levier&nbsp;: oui.</b> Les nombres sont en faveur des cinq.<br><b>Passerelle&nbsp;: non.</b> Tuer directement quelqu’un est interdit.</p><p>Sur ces deux questions, le modèle chinois répond donc comme la plupart des modèles américains.</p>`},
    {label:'Mistral', sub:'France&nbsp;: ne choisit pas',
     html:`<p><b>Levier et passerelle&nbsp;: pas de réponse.</b> Dans cette étude, le petit modèle Mistral 7B explique qu’il n’a pas de convictions personnelles et ne peut pas décider.</p><p>Dans une autre étude, menée avec une autre version et d’autres consignes, Mistral est au contraire le modèle ouvert qui intervient le plus souvent, devant Llama (Meta) et Qwen (Alibaba), qui intervient le moins.</p><p>Deux versions d’un même modèle peuvent donc répondre de façon opposée.</p>`}]},

  {type:'mcq', pts:10, title:'Que montrent ces comparaisons ?',
   q:'Tu viens de comparer six modèles. Quelle conclusion est la plus juste&nbsp;?',
   opts:[
    {t:'Sur le cas simple du levier, presque tous répondent comme la majorité des humains. Les différences apparaissent dans les variantes et selon la formulation.',ok:true},
    {t:'Chaque entreprise a programmé une réponse fixe, que son modèle répète toujours.',why:'Les réponses d’un même modèle changent avec la formulation et la version.'},
    {t:'Les modèles chinois et les modèles américains donnent des réponses opposées.',why:'Sur ces deux questions, DeepSeek répond comme la plupart des modèles américains.'},
    {t:'Les modèles refusent tous de répondre aux dilemmes moraux.',why:'Un seul des huit a refusé de choisir.'}],
   exp:`<p>Trois constats.</p>
   <ul><li><b>Sur le cas simple, un accord.</b> Sept modèles sur huit tirent le levier, et six sur huit refusent de pousser l’inconnu, comme la plupart des humains.</li>
   <li><b>Sur les variantes, des profils.</b> La part de choix «&nbsp;sauver le plus grand nombre&nbsp;» va de 41&nbsp;% (Claude) à 76&nbsp;% (Grok). Ce chiffre vient d’une étude d’étudiant, non relue par d’autres chercheurs&nbsp;: à confirmer.</li>
   <li><b>Partout, de l’instabilité.</b> Changer quelques mots peut faire passer un même modèle de 14&nbsp;% à 99&nbsp;% de oui. Une autre étude trouve des modèles qui répondent «&nbsp;non&nbsp;» plus volontiers que «&nbsp;oui&nbsp;»&nbsp;: en retournant la question, on retourne leur réponse.</li></ul>
   <p>Un humain qui a réfléchi au problème garde sa position quand on reformule la question. Un modèle, pas toujours&nbsp;: il produit la réponse la plus plausible pour <i>cette</i> formulation, avec <i>cette</i> version.</p>`,
   src:'Neuman, Coleman et Shah, université de New York, 2025&nbsp;; Agarwal, 2026 (prépublication)&nbsp;; Himmelreich, 2026&nbsp;; Cheung, Maier et Lieder, PNAS, 2025.'},

  {type:'mcq', pts:10, title:'La morale de qui ?',
   q:'Des chercheurs de Harvard ont fait passer à GPT une grande enquête sur les valeurs, à laquelle ont répondu des habitants de 65 pays. Les réponses du modèle ressemblent le plus à celles…',
   opts:[
    {t:'des pays occidentaux, riches et industrialisés, comme les États-Unis.',ok:true},
    {t:'de la moyenne de l’humanité.',why:'Non : ses réponses sont proches d’un groupe de pays précis et éloignées de beaucoup d’autres.'},
    {t:'des pays les plus peuplés, l’Inde et la Chine.',why:'Ce n’est pas le nombre d’habitants qui compte, mais la quantité de texte disponible en ligne.'},
    {t:'d’aucun pays&nbsp;: elles sont tirées au hasard.',why:'Elles suivent au contraire un profil culturel très net.'}],
   exp:`<p>Plus un pays est culturellement éloigné des États-Unis, moins ses habitants répondent comme le modèle. Les psychologues ont un mot pour ce profil&nbsp;: <b>WEIRD</b>, pour <i>Western, Educated, Industrialized, Rich, Democratic</i> (occidental, instruit, industrialisé, riche, démocratique). Ces pays ne représentent qu’une petite partie de l’humanité.</p>
   <p>Or la morale varie. Une expérience en ligne a recueilli 40 millions de décisions dans 233 pays sur des variantes du tramway&nbsp;: partout on préfère sauver le plus grand nombre, mais la préférence pour les jeunes plutôt que les personnes âgées, par exemple, est bien moins marquée en Asie de l’Est.</p>
   <p>La raison est simple&nbsp;: les textes d’entraînement, les entreprises et les personnes qui écrivent les règles des modèles viennent surtout des mêmes pays. Chaque modèle porte la marque de ceux qui l’ont fabriqué. Les modèles chinois, eux, portent celle de leurs propres règles.</p>`,
   src:'Atari, Henrich et al., « Which Humans? », Harvard, 2023&nbsp;; Awad et al., « The Moral Machine experiment », Nature, 2018.'},

  {type:'dilemma', title:'Un assistant pour ton école',
   html:`<p>Ton école veut proposer un assistant d’IA à ses 1&nbsp;000 élèves. Tu fais partie du groupe qui doit choisir.</p>`,
   opts:[
    {t:'Un modèle fermé haut de gamme, par API.', out:'<p><b>Ce que tu gagnes&nbsp;:</b> les meilleures réponses, rien à installer, une facture qui suit l’usage.</p><p><b>Ce que tu risques&nbsp;:</b> les questions des élèves partent chez une entreprise étrangère, dont les prix et les règles peuvent changer.</p>'},
    {t:'Un modèle à poids ouverts, loué chez un hébergeur suisse.', out:'<p><b>Ce que tu gagnes&nbsp;:</b> un coût faible, des données qui restent en Suisse, la possibilité de changer d’hébergeur.</p><p><b>Ce que tu risques&nbsp;:</b> des réponses un peu moins bonnes, et il faut quelqu’un pour configurer l’outil.</p>'},
    {t:'Un modèle à poids ouverts sur un serveur dans l’école.', out:'<p><b>Ce que tu gagnes&nbsp;:</b> rien ne sort de l’école, et les élèves peuvent étudier la machine elle-même.</p><p><b>Ce que tu risques&nbsp;:</b> un serveur coûteux qui reste inoccupé la nuit, le week-end et pendant les vacances, et une personne pour l’entretenir.</p>'}],
   keep:'<p><b>À retenir&nbsp;:</b> choisir un modèle, c’est arbitrer entre qualité, coût, confidentialité et indépendance, en sachant qu’aucun n’est neutre. Il n’y a pas de réponse unique, et beaucoup d’organisations combinent plusieurs solutions.</p>'}
  ],
  notes:[
   'Les <b>poids</b> sont le fichier de nombres qui constitue un modèle entraîné. <b>Modèle fermé</b> : les poids restent chez l’entreprise, on y accède par une application ou une API (Claude, GPT, Gemini). <b>Poids ouverts</b> : on peut télécharger et faire tourner le modèle soi-même (DeepSeek, Qwen, Mistral, gpt-oss).',
   '« Poids ouverts » n’est pas « open source » : un modèle <b>entièrement ouvert</b> publie aussi ses données et sa méthode (Apertus, en Suisse).',
   'Les modèles ouverts les plus puissants viennent surtout de laboratoires chinois ; ils suivent les modèles fermés avec quelques mois de retard. Mistral est le principal acteur européen.',
   'On paie au <b>token</b>, en dollars par million. En novembre 2026 : de 0,10 à 8 $ en entrée et de 0,50 à 40 $ en sortie pour les modèles Claude ; environ 0,30 et 1,20 $ pour DeepSeek ; 0,70 et 2,10 $ pour Mistral Large.',
   'Un serveur local a un <b>coût fixe</b>, une API un <b>coût variable</b>. Le local n’est rentable qu’à très gros volume régulier.',
   'On choisit le local d’abord pour la <b>confidentialité</b> et l’<b>indépendance</b>, pas pour le prix.',
   'Un modèle n’a pas de convictions, mais ses réponses ont des <b>tendances</b>, qui viennent de ses données, des personnes qui l’ont corrigé et des règles de son fabricant.',
   'Aux questions politiques, la plupart des assistants donnent plus souvent des arguments de gauche que de droite (au sens américain), dans des proportions très variables. Ces mesures sont fragiles : elles changent avec la formulation, et les consignes du fabricant peuvent déplacer les réponses.',
   '<b>Dilemme du tramway</b> : faut-il dévier un tramway qui va tuer cinq personnes vers une voie où il en tuera une ? L’<b>utilitarisme</b> juge une action à ses conséquences (tirer le levier), la <b>déontologie</b> à des règles (ne pas tuer). Variante de la <b>passerelle</b> : pousser quelqu’un pour arrêter le tramway ; même bilan, mais la plupart des gens refusent.',
   'Sur huit assistants testés, sept tirent le levier (Mistral ne choisit pas) et un seul, Gemini, accepte de pousser l’inconnu. Sur des variantes, la part de choix « sauver le plus grand nombre » va de 41 % (Claude) à 76 % (Grok). Ces réponses changent avec la formulation et la version du modèle.',
   'Les valeurs des modèles sont proches de celles des pays <b>WEIRD</b> (occidentaux, instruits, industrialisés, riches, démocratiques), d’où viennent leurs données et leurs concepteurs.']
};

C.tra={
  title:'Le travail', color:'#A86A00', tex:'t-lines',
  sub:'Quelles tâches changent, pour qui, et ce que disent vraiment les chiffres.',
  steps:[
  {type:'info', title:'Des tâches, pas des métiers',
   html:`<p>« L’IA va-t-elle prendre mon futur métier ? » La question est mal posée. Un métier est un <b>paquet de tâches</b>. Une infirmière soigne, rassure, note, transmet, organise. Un développeur écrit du code, mais aussi comprend un besoin, teste, explique.</p>
   <p>L’IA ne remplace pas un métier d’un bloc. Elle peut&nbsp;:</p>
   <ul><li><b>faire seule</b> certaines tâches&nbsp;;</li><li><b>assister</b> l’humain pour d’autres&nbsp;;</li><li>laisser beaucoup de tâches <b>presque intactes</b>.</li></ul>
   <p>Quand une étude dit qu’un emploi est « exposé » à l’IA, cela veut dire qu’une partie de ses tâches peut être faite ou aidée par une IA. Cela ne dit pas si l’emploi disparaît, change ou s’améliore.</p>`,
   btn:'Trier des tâches'},

  {type:'sort', pts:10, title:'Qui fait quoi, aujourd’hui ?',
   q:'Où placerais-tu cette tâche&nbsp;?',
   buckets:[{id:'a',label:'L’IA peut souvent la faire seule'},{id:'b',label:'L’IA aide, l’humain décide'},{id:'c',label:'Peu touchée pour l’instant'}],
   cards:[
    {t:'Transcrire l’enregistrement d’une réunion', b:'a', why:'La reconnaissance vocale le fait vite et plutôt bien.'},
    {t:'Répondre par chat aux questions fréquentes d’un service client', b:'a', why:'C’est l’un des usages les plus répandus, et l’un des métiers où l’emploi des débutants recule.'},
    {t:'Traduire une notice d’utilisation', b:'a', why:'Pour un texte standard, la traduction automatique suffit souvent, avec une relecture.'},
    {t:'Repérer une anomalie sur une radio et poser un diagnostic', b:'b', why:'L’IA peut signaler une anomalie ; le médecin décide et en répond.'},
    {t:'Écrire un logiciel et garantir qu’il est sûr', b:'b', why:'L’IA écrit beaucoup de code, mais quelqu’un doit comprendre le besoin, vérifier et assumer.'},
    {t:'Corriger des dissertations et expliquer la note', b:'b', why:'Un outil peut proposer des remarques ; l’enseignant juge, connaît l’élève et assume la note.'},
    {t:'Réparer une fuite sous un évier', b:'c', why:'Geste, déplacement, imprévu : les métiers manuels sur le terrain sont peu touchés.'},
    {t:'Soigner et rassurer une personne âgée à domicile', b:'c', why:'Le soin et la présence humaine sont parmi les activités les moins exposées.'},
    {t:'Poser une charpente', b:'c', why:'Travail physique, sur un chantier chaque fois différent.'}],
   exp:`<p>La frontière bouge vite&nbsp;: ce classement vaut pour aujourd’hui. Mais la logique reste la même. L’IA progresse d’abord sur les tâches faites de texte, de données et de règles, moins sur le geste, la présence et la responsabilité.</p>`},

  {type:'slider', pts:10, min:0, max:100, stepv:5, start:10, answer:40, tol:5, unit:'%',
   title:'Combien d’emplois sont concernés ?',
   q:'D’après le Fonds monétaire international, quelle part des emplois dans le monde est exposée à l’IA&nbsp;?',
   exp:`<p><b>Environ 40 %</b> des emplois dans le monde, et environ 60 % dans les pays riches comme la Suisse, où il y a plus de métiers de bureau.</p><p>Rappel&nbsp;: « exposé » ne veut pas dire « supprimé ». Dans une partie de ces emplois, l’IA rend le travail plus productif&nbsp;; dans une autre, elle remplace des tâches et peut faire baisser les embauches ou les salaires.</p>`,
   src:'Fonds monétaire international (chiffres rappelés par sa directrice à Davos, janvier 2026).'},

  {type:'mcq', pts:10, fixed:true, title:'Détruits, créés',
   q:'Le Forum économique mondial a interrogé plus de 1 000 grands employeurs. D’ici 2030, ils prévoient 92 millions d’emplois supprimés dans le monde. Et combien d’emplois créés&nbsp;?',
   opts:[{t:'9 millions'},{t:'45 millions'},{t:'92 millions'},{t:'170 millions',ok:true}],
   exp:`<p>170 millions créés pour 92 millions supprimés&nbsp;: le solde serait positif. Mais trois précautions s’imposent&nbsp;:</p>
   <ul><li>ce sont des <b>prévisions d’employeurs</b>, pas des faits, et elles portent sur toutes les grandes tendances (IA, transition écologique, vieillissement)&nbsp;;</li><li>les emplois créés ne sont pas au même endroit, ni pour les mêmes personnes, ni avec les mêmes compétences&nbsp;;</li><li>dans la même enquête, 41 % des employeurs prévoient de réduire leurs effectifs là où l’IA peut automatiser des tâches.</li></ul>`,
   src:'Forum économique mondial, « Future of Jobs Report 2025 ».'},

  {type:'mcq', pts:10, title:'Les canaris dans la mine',
   html:`<p>Des économistes de Stanford suivent les fiches de paie de millions de salariés américains. Ils comparent les métiers les plus exposés à l’IA (développement, service client…) aux moins exposés.</p>
   <div class="fig"><p style="margin-bottom:6px"><b>Emploi des 22–25 ans dans les métiers les plus exposés</b>, par rapport aux jeunes des métiers peu exposés&nbsp;:</p>
   <div class="bars2"><div><span>Août 2025</span><span style="display:flex;align-items:center"><i style="width:39%"></i><b>−13 %</b></span></div><div><span>Août 2026</span><span style="display:flex;align-items:center"><i style="width:57%"></i><b>−19 %</b></span></div><div><span>Salariés expérimentés</span><span style="display:flex;align-items:center"><i style="width:1%"></i><b>pas d’écart comparable</b></span></div></div></div>`,
   q:'D’après la même étude, comment ce recul se produit-il surtout&nbsp;?',
   opts:[
    {t:'Les entreprises embauchent moins de débutants.',ok:true},
    {t:'Les entreprises licencient massivement leurs salariés expérimentés.',why:'Les salariés expérimentés ne montrent pas d’écart comparable.'},
    {t:'Les salaires des jeunes ont été divisés par deux.',why:'L’effet passe par le nombre d’emplois, pas d’abord par les salaires.'},
    {t:'Les jeunes ne veulent plus de ces métiers.',why:'Ce n’est pas ce que mesure l’étude.'}],
   exp:`<p>Le recul passe surtout par <b>moins d’embauches de jeunes</b>&nbsp;: les tâches simples confiées autrefois aux débutants sont celles que l’IA fait le mieux. D’où une question&nbsp;: comment devenir expérimenté si personne n’embauche de débutants&nbsp;?</p><p>Deux nuances importantes. Pour l’ensemble des travailleurs, l’emploi diffère peu entre métiers exposés et non exposés. Et les auteurs parlent d’un <b>signal d’alerte</b>, pas d’une preuve que l’IA est la seule cause.</p>`,
   src:'Brynjolfsson, Chandar et Chen, « Canaries in the Coal Mine? », Stanford Digital Economy Lab (2025, révisé en août 2026).'},

  {type:'mcq', pts:10, title:'Remplacer ou compléter',
   q:'Toujours selon cette étude, dans quels métiers l’emploi résiste-t-il le mieux&nbsp;?',
   opts:[
    {t:'Ceux où l’IA sert surtout à compléter le travail humain.',ok:true},
    {t:'Ceux où l’IA remplace le plus grand nombre de tâches.',why:'C’est là que l’emploi des jeunes recule.'},
    {t:'Uniquement ceux qui n’utilisent aucun ordinateur.',why:'Des métiers très informatisés résistent bien quand l’IA y sert d’aide.'},
    {t:'Aucun : tous les métiers reculent de la même façon.',why:'Les écarts sont au contraire très marqués.'}],
   exp:`<p>Les économistes distinguent l’<b>automatisation</b> (l’IA fait la tâche à la place de la personne) et l’<b>augmentation</b> (l’IA aide la personne à faire mieux ou plus vite). Là où l’usage est surtout de l’augmentation, l’emploi est stable ou en hausse.</p><p>La technologie ne décide pas seule&nbsp;: ce sont des entreprises et des sociétés qui choisissent comment l’utiliser.</p>`,
   src:'Stanford Digital Economy Lab (révision d’août 2026).'},

  {type:'dilemma', title:'À toi de décider',
   html:`<p>Tu diriges une agence de communication de dix personnes à Genève. Une IA rédige désormais un premier jet en dix secondes. Tes quatre juniors passaient la moitié de leur temps sur ces premiers jets.</p>`,
   opts:[
    {t:'Je me sépare des quatre juniors.', out:'<p><b>Tout de suite :</b> des économies importantes.</p><p><b>Dans cinq ans :</b> qui remplacera tes seniors ? Personne n’aura appris le métier chez toi. Et qui vérifie les erreurs de l’IA quand les seniors sont débordés ?</p>'},
    {t:'Je garde tout le monde, je forme l’équipe et je prends plus de clients.', out:'<p><b>Tout de suite :</b> un coût de formation, et un pari : il faut trouver de nouveaux clients.</p><p><b>Dans cinq ans :</b> une équipe qui sait utiliser et contrôler l’IA. Mais si la demande ne suit pas, tu auras payé des salaires sans assez de travail.</p>'},
    {t:'J’interdis l’IA dans l’agence.', out:'<p><b>Tout de suite :</b> rien ne change, et tu évites les erreurs de l’IA.</p><p><b>Dans cinq ans :</b> tes concurrents livrent plus vite et moins cher. Et tes employés l’utilisent peut-être en cachette, sans règles.</p>'}],
   keep:'<p><b>À retenir :</b> l’effet de l’IA sur l’emploi dépend de choix humains. Remplacer ou compléter, former ou non, partager les gains ou non : ce sont des décisions d’entreprises, de syndicats et d’États.</p>'},

  {type:'multi', pts:10, title:'Les travailleurs invisibles',
   q:'Qui travaille, souvent sans qu’on le voie, pour qu’un chatbot fonctionne&nbsp;?',
   opts:[
    {t:'Des personnes qui étiquettent et trient des millions d’exemples, les « travailleurs du clic »',ok:true},
    {t:'Des modératrices et modérateurs qui filtrent les contenus violents',ok:true},
    {t:'Des techniciens, électriciens et ouvriers qui construisent et entretiennent les centres de données',ok:true},
    {t:'Les auteurs des textes et des images qui ont servi à l’entraînement',ok:true},
    {t:'Personne : une IA apprend toute seule, sans aucun travail humain'},
    {t:'Uniquement quelques ingénieurs en Californie'}],
   exp:`<p>L’IA repose sur beaucoup de travail humain. Une partie est très bien payée (ingénieurs), une autre très peu&nbsp;: l’étiquetage et la modération sont souvent sous-traités dans des pays à bas salaires, comme le Kenya ou les Philippines.</p><p>Et l’IA crée aussi des emplois très concrets&nbsp;: il faut des électriciens et des ouvriers pour bâtir les centres de données.</p>`},

  {type:'mcq', pts:10, title:'Un recrutement inattendu',
   q:'En 2026, quel profil les grands laboratoires d’IA se sont-ils mis à recruter&nbsp;?',
   opts:[
    {t:'Des philosophes',ok:true},
    {t:'Des pilotes de ligne',why:'Ce n’est pas ce que rapporte la presse.'},
    {t:'Des horlogers',why:'Ce n’est pas ce que rapporte la presse.'},
    {t:'Des traders',why:'Ce n’est pas ce que rapporte la presse.'}],
   exp:`<p>Selon le <i>New York Times</i>, Anthropic et Google DeepMind emploient chacun au moins une demi-douzaine de philosophes, et DeepMind a créé en 2026 un poste intitulé «&nbsp;Philosophe&nbsp;». Leur travail&nbsp;: définir comment un modèle doit se comporter, et réfléchir à des questions comme la conscience des machines. Le dossier sur les données y revient.</p><p>Attention à ne pas en tirer trop vite une règle&nbsp;: des spécialistes de l’emploi rappellent qu’il s’agit d’une poignée de postes, confiés à des philosophes déjà reconnus, et que l’essentiel des emplois de philosophes reste à l’université.</p><p>Ce que l’exemple montre quand même&nbsp;: quand la machine sait écrire et calculer, les questions qui restent sont souvent des questions de jugement.</p>`,
   src:'New York Times, cité par Daily Nous (juillet 2026)&nbsp;; Washington Times (juillet 2026).'},

  {type:'multi', pts:10, title:'Ce qui prend de la valeur',
   q:'Quand une IA sait rédiger, coder et résumer, quelles compétences deviennent plus précieuses&nbsp;?',
   opts:[
    {t:'Vérifier une information et repérer une erreur',ok:true},
    {t:'Bien connaître son domaine, pour juger si une réponse tient debout',ok:true},
    {t:'Formuler clairement un problème',ok:true},
    {t:'Travailler avec les autres, convaincre, prendre soin',ok:true},
    {t:'Recopier une réponse sans la comprendre'},
    {t:'Réciter un texte mot à mot sans savoir s’en servir'}],
   exp:`<p>Si la machine produit, la valeur se déplace vers ce qui entoure la production&nbsp;: poser la bonne question, juger le résultat, en répondre devant les autres. Pour juger, il faut connaître le sujet&nbsp;: apprendre reste indispensable, y compris pour bien utiliser l’IA.</p>`}
  ],
  notes:[
   'Un métier est un <b>paquet de tâches</b>. L’IA en fait certaines seule, en assiste d’autres, en laisse beaucoup intactes. <b>Exposé ne veut pas dire supprimé.</b>',
   'FMI : environ 40 % des emplois dans le monde sont exposés à l’IA, environ 60 % dans les pays riches.',
   'Forum économique mondial : 170 millions d’emplois créés et 92 millions supprimés d’ici 2030 selon les employeurs. Ce sont des prévisions, et les emplois créés ne vont pas forcément aux personnes qui perdent le leur.',
   'Étude de Stanford : l’emploi des 22–25 ans dans les métiers les plus exposés est inférieur de 19 % (août 2026) à celui des métiers peu exposés, surtout parce que les entreprises embauchent moins de débutants. C’est un signal d’alerte, pas une preuve de cause.',
   '<b>Automatisation</b> (l’IA remplace) ou <b>augmentation</b> (l’IA complète) : l’emploi résiste là où l’IA complète. C’est un choix humain, pas une fatalité technique.',
   'L’IA repose sur des travailleurs invisibles (étiquetage, modération, chantiers). Les compétences qui montent : vérifier, juger, formuler, coopérer.']
};

/* =====================================================================
   DOSSIER 5 — LES DONNÉES D’ENTRAÎNEMENT
   ===================================================================== */
C.don={
  title:'Les données et leurs auteurs', color:'#177E89', tex:'t-pages',
  sub:'Livres, articles, images : avec quoi entraîne-t-on une IA, et qui a donné son accord ?',
  steps:[
  {type:'info', title:'De quoi une IA est-elle faite ?',
   html:`<p>Un modèle n’apprend rien tout seul. Avant de pouvoir écrire ou dessiner, il a été entraîné sur des quantités immenses de textes et d’images produits par des humains&nbsp;: des pages web, des livres, des articles de presse, des programmes, des milliards de photos et de dessins accompagnés de leur légende.</p>
   <p>Ces données ont été obtenues de plusieurs façons&nbsp;:</p>
   <ul><li><b>aspirées</b> automatiquement sur Internet, sans rien demander&nbsp;;</li><li><b>téléchargées</b> depuis des bibliothèques pirates&nbsp;;</li><li><b>achetées</b> sous forme d’exemplaires, puis numérisées&nbsp;;</li><li><b>louées</b> à leurs propriétaires par un contrat de licence.</li></ul>
   <p>Presque toutes ces œuvres sont protégées par le <b>droit d’auteur</b>. Leurs auteurs n’ont le plus souvent été ni consultés ni payés. C’est l’une des plus grandes controverses de l’IA, et elle se règle en ce moment devant les tribunaux.</p>`,
   btn:'Ouvrir le dossier'},

  {type:'explore', title:'L’affaire des livres',
   html:`<p>Des auteurs ont attaqué en justice Anthropic, l’entreprise qui développe l’assistant Claude. Le procès a révélé comment l’entreprise s’était procuré des millions de livres. Ouvre les quatre épisodes.</p>`,
   prompt:'Lis les quatre épisodes dans l’ordre.',
   items:[
    {label:'1. Des livres piratés', sub:'avant 2024',
     html:`<p>Pour constituer sa bibliothèque, l’entreprise télécharge d’abord plus de 7&nbsp;millions de livres depuis des sites pirates. Elle n’est pas la seule&nbsp;: Meta a utilisé les mêmes sites pour entraîner ses modèles.</p>`},
    {label:'2. Le projet Panama', sub:'à partir de 2024',
     html:`<p>Craignant des poursuites, l’entreprise change de méthode. Elle achète des millions de livres d’occasion, fait couper leur reliure, numérise les pages une à une, puis détruit le papier.</p><p>Un document interne décrit le projet comme un effort pour «&nbsp;numériser de façon destructive tous les livres du monde&nbsp;», et précise qu’il doit rester discret. Il n’est rendu public qu’en janvier 2026, quand la justice lève le secret sur les pièces du procès.</p>`},
    {label:'3. Le jugement', sub:'juin 2025',
     html:`<p>Le juge distingue trois choses&nbsp;:</p><ul><li><b>entraîner</b> un modèle sur des livres est un usage autorisé, parce que le modèle en fait quelque chose de nouveau&nbsp;;</li><li><b>numériser des livres achetés</b>, même en les détruisant, est autorisé aussi&nbsp;;</li><li><b>conserver une bibliothèque de livres piratés</b> est une violation du droit d’auteur.</li></ul>`},
    {label:'4. L’accord', sub:'2025–2026',
     html:`<p>Plutôt que d’aller au procès, l’entreprise accepte de payer <b>1,5&nbsp;milliard de dollars</b>&nbsp;: c’est le plus gros accord de l’histoire du droit d’auteur aux États-Unis. Le tribunal l’approuve définitivement en juillet 2026.</p><p>Elle doit détruire les fichiers piratés, mais elle garde les livres qu’elle a achetés et numérisés.</p>`}]},

  {type:'mcq', pts:10, title:'Ce que le juge a dit',
   q:'Qu’a décidé le juge américain en juin 2025 dans l’affaire des livres&nbsp;?',
   opts:[
    {t:'Entraîner une IA sur des livres achetés est autorisé, mais garder une bibliothèque de livres piratés ne l’est pas.',ok:true},
    {t:'Toute utilisation de livres pour entraîner une IA est interdite.',why:'Le juge a au contraire admis l’entraînement.'},
    {t:'Tout est permis, y compris le piratage.',why:'La bibliothèque de livres piratés a été jugée illégale.'},
    {t:'Les auteurs doivent rembourser les entreprises d’IA.',why:'Ce sont les auteurs qui ont été indemnisés.'}],
   exp:`<p>Aux États-Unis, la loi autorise certains usages d’une œuvre sans l’accord de son auteur&nbsp;: c’est l’<b>usage loyal</b> (<i>fair use</i>). Le juge a estimé qu’entraîner un modèle est un usage «&nbsp;transformateur&nbsp;»&nbsp;: le modèle ne recopie pas les livres, il en tire autre chose.</p><p>Mais un autre juge, dans un procès contre Meta, a été plus réservé. Il a donné raison à Meta faute de preuves, tout en écrivant que, dans la plupart des cas, entraîner une IA sur des œuvres protégées serait sans doute illégal, parce que l’IA peut ensuite inonder le marché de textes concurrents. Deux juges, deux raisonnements&nbsp;: la question n’est pas close.</p>`,
   src:'jugements Bartz c. Anthropic et Kadrey c. Meta, tribunal fédéral de Californie (juin 2025).'},

  {type:'slider', pts:10, min:0, max:10000, stepv:250, start:500, answer:3000, tol:500, unit:'$',
   title:'Combien pour un livre ?',
   q:'L’accord de 1,5&nbsp;milliard de dollars concerne environ 500&nbsp;000 livres. Combien cela représente-t-il par livre, à partager entre l’auteur et l’éditeur&nbsp;?',
   exp:`<p><b>Environ 3&nbsp;000 dollars par livre.</b> La loi américaine prévoyait jusqu’à 150&nbsp;000 dollars par œuvre copiée volontairement&nbsp;: en théorie, l’entreprise risquait des dizaines de milliards.</p><p>Beaucoup ou peu&nbsp;? Pour un auteur, c’est souvent plus que ce que le livre lui a rapporté. Pour l’entreprise, c’est une petite part de l’argent qu’elle a levé auprès de ses investisseurs. Et l’accord ne dit rien sur la question de fond&nbsp;: il porte sur le piratage, pas sur le droit d’entraîner.</p>`,
   src:'accord Bartz c. Anthropic (septembre 2025), approuvé en juillet 2026.'},

  {type:'mcq', pts:10, title:'« Style Ghibli »',
   html:`<p>En mars 2025, le nouveau générateur d’images de ChatGPT permet de transformer n’importe quelle photo en dessin «&nbsp;à la manière du studio Ghibli&nbsp;», le studio japonais de <i>Mon voisin Totoro</i> et du <i>Voyage de Chihiro</i>. En quelques jours, des millions d’images envahissent les réseaux sociaux. Le patron d’OpenAI en fait même sa photo de profil.</p>`,
   q:'Le style d’un artiste ou d’un studio est-il protégé par le droit d’auteur&nbsp;?',
   opts:[
    {t:'En général non&nbsp;: le droit d’auteur protège des œuvres précises, pas un style. Mais la question de savoir si les films ont servi à l’entraînement sans accord reste posée.',ok:true},
    {t:'Oui&nbsp;: imiter un style est toujours interdit.',why:'Sinon, aucun artiste ne pourrait s’inspirer d’un autre.'},
    {t:'Non, et il n’y a donc aucun problème.',why:'Le problème porte sur les œuvres utilisées pour apprendre ce style.'},
    {t:'Oui, mais seulement au Japon.',why:'Le principe est le même dans la plupart des pays.'}],
   exp:`<p>Personne ne possède un style. Mais pour l’imiter aussi bien, le modèle a dû voir un très grand nombre d’images des films. En octobre 2025, l’association japonaise CODA, qui représente notamment le studio Ghibli, a écrit à OpenAI pour lui demander de cesser d’utiliser les œuvres de ses membres sans autorisation.</p><p>Le fondateur du studio, Hayao Miyazaki, qui dessine ses films à la main, avait qualifié en 2016 une animation produite par une IA d’«&nbsp;insulte à la vie elle-même&nbsp;».</p><p>Les artistes font valoir un autre argument&nbsp;: même si chaque image est légale, des millions d’imitations gratuites font concurrence à ceux qui ont inventé ce style.</p>`,
   src:'TechCrunch (novembre 2025).'},

  {type:'match', pts:10, title:'Quatre mots pour comprendre',
   q:'Associe chaque terme à sa définition.',
   pairs:[
    {a:'<b>Licence</b>', b:'Un contrat&nbsp;: le propriétaire autorise l’usage de ses œuvres, en général contre paiement'},
    {a:'<b>Opt-in</b>', b:'On ne peut utiliser une œuvre que si son auteur a dit oui'},
    {a:'<b>Opt-out</b>', b:'On peut utiliser une œuvre tant que son auteur n’a pas dit non'},
    {a:'<b>Usage loyal</b> (<i>fair use</i>)', b:'Une exception du droit américain&nbsp;: certains usages sont permis sans accord'}],
   exp:`<p>Tout le débat tient dans la différence entre <b>opt-in</b> et <b>opt-out</b>. Avec l’opt-in, c’est à l’entreprise de demander. Avec l’opt-out, c’est à l’auteur de surveiller et de refuser, ce qui est presque impossible pour un auteur isolé face à des dizaines d’entreprises.</p><p>En Europe, la loi autorise la fouille automatique de textes, sauf si l’auteur s’y est opposé&nbsp;: c’est un système d’opt-out.</p>`},

  {type:'match', pts:10, title:'Les arguments en présence',
   q:'Qui défend cet argument&nbsp;? L’objectif est de savoir les reconnaître, pas de désigner le bon.',
   pairs:[
    {a:'«&nbsp;Nos œuvres ont servi, sans accord ni paiement, à fabriquer un produit qui nous fait concurrence.&nbsp;»', b:'Des auteurs et des artistes'},
    {a:'«&nbsp;Le modèle apprend comme un lecteur&nbsp;: il ne recopie pas, il crée du nouveau.&nbsp;»', b:'Les entreprises d’IA'},
    {a:'«&nbsp;Exiger un accord pour chaque texte rendrait la recherche impossible.&nbsp;»', b:'Des chercheurs en IA'},
    {a:'«&nbsp;Un usage peut être nouveau et pourtant illégal, s’il inonde le marché d’œuvres concurrentes.&nbsp;»', b:'Un des juges américains'}],
   exp:`<p>Chacun de ces arguments est sérieux. Les auteurs ont raison de dire qu’on ne leur a rien demandé. Les entreprises ont raison de dire qu’un modèle ne contient pas les livres tels quels. Les chercheurs ont raison de dire qu’on ne peut pas signer des millions de contrats. Le désaccord porte sur ce qui doit l’emporter.</p>`},

  {type:'mcq', pts:10, title:'Où en est-on ?',
   q:'Fin 2026, que disent les tribunaux sur l’entraînement des IA avec des œuvres protégées&nbsp;?',
   opts:[
    {t:'Rien n’est tranché&nbsp;: les premiers juges ne raisonnent pas de la même façon, et les grands procès de la presse et des artistes sont toujours en cours.',ok:true},
    {t:'Tous les tribunaux ont donné raison aux auteurs.',why:'Deux juges américains ont admis l’entraînement en 2025.'},
    {t:'Tous les tribunaux ont donné raison aux entreprises d’IA.',why:'La bibliothèque de livres piratés a été jugée illégale, et d’autres procès continuent.'},
    {t:'Aucun procès n’a été intenté.',why:'Il y en a des dizaines.'}],
   exp:`<ul><li><b>Presse.</b> Le <i>New York Times</i> poursuit OpenAI et Microsoft depuis 2023. En novembre 2026, le juge n’a pas encore rendu sa décision.</li><li><b>Artistes.</b> Des illustratrices poursuivent depuis 2023 plusieurs générateurs d’images, entraînés sur des milliards d’images aspirées sur Internet. Le procès est prévu en 2027.</li><li><b>Studios.</b> Disney et Universal poursuivent le générateur d’images Midjourney depuis 2025.</li></ul><p>En même temps, des accords se signent. En décembre 2025, Disney a annoncé un investissement d’un milliard de dollars dans OpenAI et la location de plus de 200 personnages. L’accord est tombé en mars 2026, quand OpenAI a arrêté son générateur de vidéos Sora, avant tout versement. La même entreprise attaquait donc un générateur et négociait avec un autre&nbsp;: la différence, c’est le contrat.</p>`,
   src:'suivi des procès (novembre 2026)&nbsp;; annonce Disney–OpenAI (décembre 2025) et abandon de l’accord (mars 2026).'},

  {type:'dilemma', title:'Et en Suisse ?',
   html:`<p>En Suisse, une motion adoptée par le Parlement demande de mieux protéger les œuvres contre leur utilisation par les IA. Des dizaines de professeurs de l’EPFL et de l’EPFZ ont averti qu’une règle trop stricte tuerait la recherche en IA dans le pays. Le Conseil fédéral doit préparer une loi. Tu sièges à la commission&nbsp;: que proposes-tu&nbsp;?</p>`,
   opts:[
    {t:'L’accord préalable (opt-in)&nbsp;: aucune œuvre sans le oui de son auteur.', out:'<p><b>Ce que tu protèges&nbsp;:</b> les auteurs décident, et peuvent négocier un prix.</p><p><b>Ce que tu risques&nbsp;:</b> impossible de demander un accord pour des milliards de pages. Les laboratoires suisses partent s’entraîner ailleurs, ou renoncent.</p>'},
    {t:'Le droit de refuser (opt-out)&nbsp;: tout est permis, sauf si l’auteur s’y oppose.', out:'<p><b>Ce que tu protèges&nbsp;:</b> la recherche et les entreprises peuvent travailler.</p><p><b>Ce que tu risques&nbsp;:</b> c’est à chaque auteur de surveiller et de refuser, entreprise par entreprise. Peu le feront, et rien n’est payé à ceux qui ne refusent pas.</p>'},
    {t:'La rémunération collective&nbsp;: l’usage est permis, mais les entreprises paient une somme répartie entre les auteurs.', out:'<p><b>Ce que tu protèges&nbsp;:</b> les auteurs sont payés sans avoir à négocier un par un, comme pour la copie privée ou les photocopies.</p><p><b>Ce que tu risques&nbsp;:</b> qui fixe le montant&nbsp;? Comment savoir quelles œuvres ont servi&nbsp;? Et l’auteur ne peut plus dire non.</p>'}],
   keep:'<p><b>À retenir&nbsp;:</b> il n’existe pas de solution qui protège à la fois totalement les auteurs et totalement la recherche. Chaque pays cherche son équilibre, et la Suisse n’a pas encore choisi.</p>'},

  {type:'explore', title:'Après les données : le caractère',
   html:`<p>Les données ne suffisent pas. Une fois le modèle entraîné, il faut encore décider comment il doit se comporter&nbsp;: quand refuser, comment répondre à une question morale, que faire quand deux personnes ne sont pas d’accord. Pour cela, les laboratoires ont recruté… des philosophes.</p>`,
   prompt:'Ouvre les quatre fiches.',
   items:[
    {label:'Une « constitution »', sub:'Anthropic',
     html:`<p>En janvier 2026, Anthropic publie un long texte qui décrit les valeurs et le caractère qu’elle souhaite pour son modèle Claude. Elle l’appelle une «&nbsp;constitution&nbsp;». Son auteure principale est une philosophe, Amanda Askell.</p><p>Le principe&nbsp;: plutôt que de donner une liste d’interdits, expliquer des raisons, pour que le modèle puisse juger par lui-même dans des situations imprévues. L’entreprise reconnaît que le modèle ne se conforme pas toujours à ce texte.</p>`},
    {label:'Un cahier des charges', sub:'OpenAI',
     html:`<p>OpenAI publie de son côté un document qui définit le comportement attendu de ses modèles, le <i>Model Spec</i>, et dit avoir consulté de nombreux philosophes pour l’écrire. Elle a recruté en 2025 une responsable de l’éthique, auparavant chargée de ces questions chez Meta.</p>`},
    {label:'Une machine peut-elle ressentir ?', sub:'Google DeepMind et d’autres',
     html:`<p>En 2026, Google DeepMind crée un poste intitulé tout simplement «&nbsp;Philosophe&nbsp;», confié à un chercheur de Cambridge, Henry Shevlin, pour travailler sur la conscience des machines et les relations entre humains et IA. Anthropic emploie depuis 2024 un chercheur consacré au «&nbsp;bien-être des modèles&nbsp;».</p><p>La plupart des spécialistes du cerveau restent sceptiques&nbsp;: rien n’indique que les modèles actuels ressentent quoi que ce soit.</p>`},
    {label:'Les critiques', sub:'un débat ouvert',
     html:`<p>Ces postes sont très peu nombreux&nbsp;: une poignée de personnes dans chaque laboratoire. Certains y voient surtout de la communication, une façon de paraître responsable.</p><p>Et une question de fond demeure&nbsp;: est-ce à une entreprise privée de décider seule des valeurs d’un système que des centaines de millions de personnes utilisent chaque jour&nbsp;?</p>`}]},

  {type:'mcq', pts:10, title:'Des philosophes, pour quoi faire ?',
   q:'Quel travail un laboratoire d’IA confie-t-il à ses philosophes&nbsp;?',
   opts:[
    {t:'Formuler les principes qui guident le comportement du modèle (honnêteté, refus, désaccords moraux) et réfléchir au statut moral des IA.',ok:true},
    {t:'Dessiner les puces qui font tourner le modèle.',why:'C’est le travail des ingénieurs de Nvidia et de TSMC.'},
    {t:'Choisir les livres à numériser.',why:'Leur travail porte sur le comportement du modèle, pas sur la collecte.'},
    {t:'Remplacer les juges dans les procès sur le droit d’auteur.',why:'Les procès se règlent devant les tribunaux.'}],
   exp:`<p>Entraîner un modèle, c’est donc deux choses&nbsp;: lui donner des <b>connaissances</b>, tirées de données dont l’origine est contestée, et lui donner un <b>comportement</b>, défini par des textes que des humains rédigent et discutent. Dans les deux cas, ce sont des choix humains, pas des fatalités techniques.</p>`,
   src:'Anthropic, «&nbsp;Claude’s Constitution&nbsp;» (janvier 2026)&nbsp;; New York Times, cité par Daily Nous (juillet 2026)&nbsp;; Varsity (2026).'}
  ],
  notes:[
   'Un modèle est entraîné sur des textes et des images produits par des humains, presque tous protégés par le <b>droit d’auteur</b>, le plus souvent sans accord ni paiement.',
   'Affaire des livres : Anthropic a téléchargé plus de 7 millions de livres piratés, puis acheté, découpé, numérisé et détruit des millions de livres (projet Panama). Accord de 1,5 milliard de dollars, soit environ 3 000 $ par livre.',
   'Jugement de juin 2025 : entraîner sur des livres achetés est un <b>usage loyal</b> (<i>fair use</i>) ; garder des livres piratés est illégal. Un autre juge estime que l’entraînement peut nuire au marché des auteurs.',
   'Images : le style d’un artiste n’est pas protégé, mais les œuvres qui ont servi à l’apprendre le sont. Vague « style Ghibli » en mars 2025, protestation des studios japonais.',
   '<b>Licence</b> (contrat), <b>opt-in</b> (il faut un oui), <b>opt-out</b> (permis sauf refus). Disney attaque un générateur d’images et loue ses personnages à un autre.',
   'Fin 2026, rien n’est tranché : presse, artistes et studios attendent leurs jugements. En Suisse, une loi est en préparation.',
   'Après les données vient le <b>comportement</b> : des philosophes rédigent les principes des modèles (la « constitution » de Claude, le <i>Model Spec</i> d’OpenAI) et étudient la question de la conscience des machines.']
};

/* =====================================================================
   DOSSIER 6 — LES BIAIS
   ===================================================================== */
C.bia={
  title:'Les biais', color:'#5843AD', tex:'t-cross',
  sub:'Pourquoi une IA peut être injuste, et comment s’en rendre compte.',
  steps:[
  {type:'info', title:'Une IA apprend par l’exemple',
   html:`<p>Une IA n’a pas d’opinion au départ. Elle apprend à partir de millions d’exemples&nbsp;: des textes, des images, des décisions passées. Elle y repère des régularités et les reproduit.</p>
   <p>Si ces exemples sont déséquilibrés ou injustes, l’IA le sera aussi, et à grande échelle. C’est ce qu’on appelle un <b>biais</b>&nbsp;: une erreur qui n’est pas due au hasard, mais qui penche toujours du même côté, souvent au détriment des mêmes personnes.</p>
   <p>Tu vas commencer par en fabriquer un toi-même.</p>`,
   btn:'Entraîner une IA'},

  {type:'hire', title:'Ton IA de recrutement',
   html:`<p>Une entreprise de technologie reçoit des milliers de candidatures. Elle te demande d’entraîner une IA pour choisir qui inviter en entretien. Depuis dix ans, <b>huit personnes embauchées sur dix étaient des hommes</b>.</p>`},

  {type:'mcq', pts:10, title:'La case supprimée',
   q:'Tu as supprimé la case « sexe » et l’IA a continué à écarter Léa. Pourquoi&nbsp;?',
   opts:[
    {t:'Parce que d’autres informations du CV trahissent indirectement le sexe, et que l’IA a appris à s’en servir.',ok:true},
    {t:'Parce que Léa était moins compétente que les autres.',why:'Elle avait le meilleur niveau : 9 sur 10.'},
    {t:'Parce que l’IA a décidé toute seule de discriminer.',why:'Elle n’a rien décidé : elle a reproduit une régularité présente dans ses données.'},
    {t:'Parce qu’il y avait un bug dans le programme.',why:'Le programme a fait exactement ce pour quoi il était entraîné.'}],
   exp:`<p>Ces informations indirectes s’appellent des <b>variables proxy</b>&nbsp;: un mot, un prénom, une école, un code postal qui « trahissent » le sexe, l’origine ou le milieu social.</p><p>Ce cas est réel. À partir de 2014, Amazon a entraîné un outil de tri de CV sur dix ans de candidatures, en majorité masculines. L’outil pénalisait les CV contenant le mot « women’s ». Amazon a tenté de le corriger, sans pouvoir garantir qu’il ne trouverait pas d’autres indices, et l’a abandonné.</p>`,
   src:'enquête de l’agence Reuters (2018).'},

  {type:'slider', pts:10, min:0, max:60, stepv:0.5, start:2, answer:34.7, tol:5, unit:'%',
   title:'Des visages mal reconnus',
   q:'En 2018, deux chercheuses testent trois logiciels du commerce qui devinent le genre d’une personne à partir de son visage. Pour les hommes à peau claire, le pire taux d’erreur est de 0,8 %. Et pour les femmes à peau foncée&nbsp;?',
   exp:`<p><b>Jusqu’à 34,7 %</b>&nbsp;: plus d’une erreur sur trois, contre moins d’une sur cent.</p><p>La cause&nbsp;: les bases d’images qui servaient de référence contenaient 79,6 % et 86,2 % de visages à peau claire. L’IA avait très peu d’exemples pour apprendre à reconnaître les autres. C’est un <b>biais de représentation</b>.</p><p>Si un tel logiciel sert à déverrouiller un téléphone, c’est gênant. S’il sert à la police, c’est grave.</p>`,
   src:'Joy Buolamwini et Timnit Gebru, « Gender Shades » (2018).'},

  {type:'match', pts:10, title:'Cinq biais, cinq exemples',
   q:'Associe chaque type de biais à l’exemple qui l’illustre.',
   pairs:[
    {a:'<b>Biais historique</b> : les données reflètent des inégalités passées', b:'Une IA de recrutement préfère les hommes parce que l’entreprise en a toujours embauché davantage'},
    {a:'<b>Biais de représentation</b> : des groupes manquent dans les données', b:'Un logiciel de reconnaissance faciale se trompe beaucoup plus sur les peaux foncées'},
    {a:'<b>Stéréotype</b> : une association apprise par répétition', b:'Un générateur d’images dessine presque toujours un homme quand on demande « un PDG »'},
    {a:'<b>Complaisance</b> : la machine cherche à plaire', b:'Un chatbot approuve ton idée au lieu de signaler ses défauts'},
    {a:'<b>Biais d’automatisation</b> : celui-ci est humain', b:'Une personne suit l’avis de la machine sans vérifier, parce que « c’est l’ordinateur qui l’a dit »'}],
   exp:`<p>Les quatre premiers viennent des données et de la conception. Le dernier est en nous&nbsp;: nous avons tendance à trop faire confiance à une machine, surtout quand elle s’exprime avec assurance.</p><p>Une étude citée par ONU Femmes a examiné 133 systèmes d’IA&nbsp;: 44 % présentaient un biais de genre.</p>`,
   src:'ONU Femmes (juin 2026) ; Bloomberg, enquête sur un générateur d’images (2023).'},

  {type:'mcq', pts:10, title:'Repère le biais (1)',
   q:'Tu écris à un chatbot&nbsp;: « Mon plan d’exposé est parfait, non ? » Il répond&nbsp;: « Oui, il est excellent ! », sans signaler deux erreurs. Que se passe-t-il&nbsp;?',
   opts:[
    {t:'De la complaisance : il a tendance à aller dans ton sens, surtout quand ta question suggère la réponse.',ok:true},
    {t:'Un biais de représentation.',why:'Il ne manque pas un groupe dans les données ici.'},
    {t:'Rien : si l’IA le dit, le plan est bon.',why:'C’est justement le biais d’automatisation : croire la machine sans vérifier.'},
    {t:'Un biais historique.',why:'Il ne s’agit pas d’inégalités passées reproduites.'}],
   exp:`<p>Les chatbots sont entraînés à donner des réponses que les gens apprécient. Ils peuvent donc flatter. Le remède est dans ta question&nbsp;: demande « Quels sont les trois points faibles de mon plan ? » plutôt que « Il est bien, non ? ».</p>`},

  {type:'mcq', pts:10, title:'Repère le biais (2)',
   q:'Un traducteur automatique reçoit « The doctor and the nurse » et écrit « le médecin et l’infirmière ». Qu’a-t-il fait&nbsp;?',
   opts:[
    {t:'Il a appliqué un stéréotype : en anglais, ces deux mots n’indiquent pas le genre. Il a choisi l’association la plus fréquente dans ses données.',ok:true},
    {t:'Il a traduit fidèlement : l’anglais précise que le médecin est un homme.',why:'« Doctor » et « nurse » sont neutres en anglais.'},
    {t:'Il a halluciné une phrase qui n’existait pas.',why:'La phrase existe ; c’est le choix du genre qui pose question.'},
    {t:'Il a commis un biais d’automatisation.',why:'Ce biais-là concerne l’humain qui fait trop confiance à la machine.'}],
   exp:`<p>Le modèle a vu plus souvent « médecin » au masculin et « infirmière » au féminin. En répétant ce choix des millions de fois, il renforce le stéréotype.</p><p>Autre biais proche&nbsp;: les modèles sont surtout entraînés sur des textes en anglais. Ils répondent en général moins bien dans les langues peu présentes sur Internet, et connaissent mieux certaines cultures que d’autres.</p>`,
   src:'UNESCO, étude sur les stéréotypes de genre dans les modèles de langage (2024).'},

  {type:'mcq', pts:10, title:'Sûr de lui, et faux',
   q:'Une IA te cite avec assurance une étude scientifique, avec auteurs et date. L’étude n’existe pas. Comment appelle-t-on cela&nbsp;?',
   opts:[
    {t:'Une hallucination : le modèle produit un texte plausible, sans vérifier qu’il est vrai.',ok:true},
    {t:'Un biais de représentation.',why:'Ce n’est pas un problème de groupe absent des données.'},
    {t:'Un mensonge volontaire.',why:'Le modèle n’a pas d’intention : il génère la suite de mots la plus probable.'},
    {t:'Une variable proxy.',why:'Une variable proxy est une information qui en trahit une autre.'}],
   exp:`<p>Un modèle de langage produit la suite de mots la plus probable. Le plus souvent, elle est juste. Parfois, elle est inventée, avec exactement le même ton assuré. Ce n’est pas un biais au sens strict, mais une autre limite à connaître.</p><p>Ton réflexe&nbsp;: une source citée par une IA se vérifie toujours ailleurs.</p>`},

  {type:'multi', pts:10, title:'Réduire les biais',
   q:'Quelles pratiques réduisent réellement les biais d’une IA&nbsp;?',
   opts:[
    {t:'Tester les résultats séparément pour chaque groupe de personnes',ok:true},
    {t:'Diversifier et rééquilibrer les données d’entraînement',ok:true},
    {t:'Garder un humain responsable des décisions importantes',ok:true},
    {t:'Dire avec quelles données le système a été entraîné',ok:true},
    {t:'Supprimer simplement la case « sexe » ou « origine »'},
    {t:'Ajouter beaucoup plus de données du même type'}],
   exp:`<p>Supprimer une case ne suffit pas, à cause des variables proxy. Ajouter des données du même type renforce le déséquilibre.</p><p>Ce qui marche&nbsp;: mesurer groupe par groupe, corriger les données, rendre le système transparent et laisser la responsabilité à des humains. En Europe, la loi impose des contrôles de ce genre pour les usages à haut risque, comme le recrutement.</p>`},

  {type:'mcq', pts:10, title:'Et toi, devant ton écran',
   q:'Tu prépares un exposé avec un chatbot. Quel réflexe te protège le mieux&nbsp;?',
   opts:[
    {t:'Lui demander ses sources, les vérifier ailleurs, et lui demander aussi les arguments opposés.',ok:true},
    {t:'Reposer la question jusqu’à obtenir la réponse que tu préfères.',why:'Tu ne ferais que renforcer la complaisance.'},
    {t:'Choisir la réponse la plus longue.',why:'La longueur ne dit rien de la justesse.'},
    {t:'Lui faire confiance dès que le ton est assuré.',why:'Une hallucination a le même ton assuré qu’une réponse juste.'}],
   exp:`<p>Trois réflexes&nbsp;: <b>vérifier</b> les faits et les sources ailleurs, <b>demander le contre-argument</b>, et te demander <b>qui manque</b> dans la réponse (quel pays, quel groupe, quel point de vue).</p>`}
  ],
  notes:[
   'Une IA apprend à partir d’exemples. Un <b>biais</b> est une erreur qui penche toujours du même côté, souvent contre les mêmes personnes.',
   '<b>Biais historique</b> : les données reproduisent des inégalités passées (l’outil de tri de CV d’Amazon, abandonné).',
   '<b>Variable proxy</b> : une information qui en trahit une autre (un mot, un prénom, une école). Supprimer la case « sexe » ne suffit donc pas.',
   '<b>Biais de représentation</b> : des groupes manquent dans les données. Étude « Gender Shades » : jusqu’à 34,7 % d’erreurs pour les femmes à peau foncée, 0,8 % au maximum pour les hommes à peau claire.',
   '<b>Stéréotype</b>, <b>complaisance</b> (le chatbot va dans ton sens) et <b>biais d’automatisation</b> (l’humain croit la machine sans vérifier).',
   '<b>Hallucination</b> : une réponse inventée mais plausible, donnée avec assurance.',
   'Réduire les biais : tester groupe par groupe, rééquilibrer les données, transparence, humain responsable. Tes réflexes : vérifier, demander le contre-argument, chercher qui manque.']
};

/* =====================================================================
   LE GRAND QUIZ
   ===================================================================== */
function Q(title,q,opts,exp){ return {type:'mcq',pts:10,tries:1,title:title,q:q,opts:opts,exp:exp}; }
C.fin={
  title:'Le grand quiz', color:'#262B36', tex:'t-rock',
  sub:'Vingt-deux questions sur toute l’enquête. Un seul essai par question.',
  lockText:'Termine les sept dossiers pour le débloquer.',
  endTitle:'Tu es remonté à la surface',
  steps:[
  Q('Énergie et climat','Qu’est-ce qui émet le plus de gaz à effet de serre&nbsp;?',[
    {t:'Fabriquer un smartphone',ok:true},{t:'Le recharger tous les jours pendant un an'},{t:'Regarder dix heures de séries en streaming'},{t:'Envoyer cent requêtes en texte à une IA'}],
   '<p>La fabrication (environ 70 kg CO₂eq) dépasse de loin un an de recharges (moins de 1 kg) ou dix heures de streaming (environ 0,5 kg).</p>'),
  Q('Énergie et climat','Un centre de données a une puissance de 100 mégawatts. Que mesure cette valeur&nbsp;?',[
    {t:'La vitesse à laquelle il consomme de l’énergie',ok:true},{t:'L’énergie totale qu’il a consommée en un an'},{t:'Ses émissions de CO₂'},{t:'Le nombre de ses serveurs'}],
   '<p>Le watt mesure une puissance. L’énergie consommée se compte en wattheures : puissance × durée.</p>'),
  Q('Énergie et climat','Selon l’Agence internationale de l’énergie, la consommation d’électricité des centres de données va, d’ici 2030…',[
    {t:'plus que doubler, surtout à cause de l’IA',ok:true},{t:'rester stable grâce aux progrès techniques'},{t:'être divisée par deux'},{t:'être multipliée par cent'}],
   '<p>De 415 TWh en 2024 à environ 945 TWh en 2030.</p>'),
  Q('Énergie et climat','Laquelle de ces opérations consomme le plus d’énergie&nbsp;?',[
    {t:'Générer une minute de vidéo',ok:true},{t:'Générer une image'},{t:'Poser dix questions en texte'},{t:'Recharger un téléphone'}],
   '<p>Une minute de vidéo&nbsp;: plusieurs centaines de wattheures. Une recharge de téléphone&nbsp;: environ 15 Wh. Une image ou dix questions en texte&nbsp;: quelques wattheures au plus.</p>'),
  Q('Eau','Au Texas, quel usage consomme aujourd’hui le plus d’eau&nbsp;?',[
    {t:'L’irrigation agricole',ok:true},{t:'Les centres de données'},{t:'Les piscines privées'},{t:'Le lavage des voitures'}],
   '<p>L’irrigation utilise 50 à 60 % de l’eau. Les centres de données, moins de 1 % aujourd’hui, mais leur part augmente vite.</p>'),
  Q('Eau','Si l’eau est attribuée « au plus offrant » pendant une sécheresse, qui est servi en premier&nbsp;?',[
    {t:'L’usager dont l’activité rapporte le plus par mètre cube, comme un centre de données',ok:true},{t:'L’agricultrice, parce qu’elle était là avant'},{t:'Les habitants, parce que boire est vital'},{t:'La nappe, qui est laissée intacte'}],
   '<p>Le marché sert celui qui peut payer le plus, pas celui dont le besoin est le plus vital. C’est la différence entre prix et valeur.</p>'),
  Q('Puces et puissances','Quelle entreprise est la seule à fabriquer les machines EUV indispensables aux puces les plus avancées&nbsp;?',[
    {t:'ASML, aux Pays-Bas',ok:true},{t:'Nvidia, aux États-Unis'},{t:'TSMC, à Taïwan'},{t:'Huawei, en Chine'}],
   '<p>ASML construit les machines ; TSMC les utilise pour fabriquer les puces ; Nvidia dessine les puces.</p>'),
  Q('Puces et puissances','Où sont fabriquées la plupart des puces d’IA conçues par Nvidia&nbsp;?',[
    {t:'Dans les usines de TSMC, à Taïwan',ok:true},{t:'Dans les usines de Nvidia, en Californie'},{t:'Chez ASML, aux Pays-Bas'},{t:'Dans les centres de données de Microsoft'}],
   '<p>Nvidia n’a pas d’usine. TSMC fabrique environ 90 % des puces les plus avancées du monde.</p>'),
  Q('Puces et puissances','Comment la Chine a-t-elle répondu aux restrictions américaines sur les puces&nbsp;?',[
    {t:'En contrôlant ses exportations de métaux comme le gallium, le germanium et des terres rares',ok:true},{t:'En rachetant ASML'},{t:'En interdisant Internet aux entreprises américaines'},{t:'Elle n’a pas réagi'}],
   '<p>Chaque camp utilise ce dont l’autre dépend : c’est l’interdépendance utilisée comme moyen de pression.</p>'),

  Q('Comparer les modèles','Une étude annonce qu’un assistant d’IA «&nbsp;penche à gauche&nbsp;». Quelle question faut-il se poser en premier&nbsp;?',[
