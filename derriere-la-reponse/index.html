   '<p>C’est le profil WEIRD&nbsp;: plus un pays est culturellement éloigné des États-Unis, moins ses habitants répondent comme le modèle.</p>'),
  Q('Travail','Une étude dit qu’un métier est « exposé à l’IA ». Qu’est-ce que cela signifie&nbsp;?',[
    {t:'Qu’une partie de ses tâches peut être faite ou aidée par une IA',ok:true},{t:'Que ce métier aura disparu dans cinq ans'},{t:'Que les salaires vont forcément baisser'},{t:'Que l’IA y est interdite'}],
   '<p>Exposé ne veut pas dire supprimé : tout dépend de si l’IA remplace ou complète le travail.</p>'),
  Q('Travail','D’après l’étude de Stanford, qui est touché en premier dans les métiers les plus exposés&nbsp;?',[
    {t:'Les débutants de 22 à 25 ans, parce que les entreprises embauchent moins',ok:true},{t:'Les salariés proches de la retraite'},{t:'Tous les âges, de la même façon'},{t:'Personne : aucun effet n’est mesuré'}],
   '<p>Un écart de 19 % en août 2026 pour les 22–25 ans, sans écart comparable pour les salariés expérimentés.</p>'),
  Q('Données et auteurs','Dans l’affaire des livres jugée en 2025, quelle pratique a été déclarée illégale&nbsp;?',[
    {t:'Conserver une bibliothèque de livres téléchargés sur des sites pirates',ok:true},{t:'Entraîner un modèle sur des livres achetés'},{t:'Numériser des livres achetés'},{t:'Vendre des livres d’occasion'}],
   '<p>Le juge a admis l’entraînement et la numérisation de livres achetés, mais pas le piratage. L’entreprise a accepté de payer 1,5 milliard de dollars.</p>'),
  Q('Données et auteurs','Dans un système d’<i>opt-in</i>, une entreprise d’IA peut utiliser une œuvre…',[
    {t:'seulement si son auteur a donné son accord',ok:true},{t:'tant que son auteur n’a pas refusé'},{t:'dans tous les cas'},{t:'seulement si l’auteur est décédé'}],
   '<p>Opt-in : il faut un oui. Opt-out : c’est permis sauf refus. La différence décide de qui doit faire la démarche.</p>'),
  Q('Biais','Pourquoi supprimer la case « sexe » ne suffit-il pas à rendre une IA de recrutement équitable&nbsp;?',[
    {t:'Parce que d’autres informations (mots, prénoms, écoles) trahissent indirectement le sexe',ok:true},{t:'Parce que l’IA devine le sexe en regardant la photo'},{t:'Parce que la loi interdit de supprimer cette case'},{t:'Cela suffit : le problème est réglé'}],
   '<p>Ce sont les variables proxy. Il faut tester les résultats groupe par groupe.</p>'),
  Q('Biais','L’étude « Gender Shades » a montré que des logiciels d’analyse du visage…',[
    {t:'se trompaient bien plus sur les femmes à peau foncée, peu présentes dans leurs données d’entraînement',ok:true},{t:'reconnaissaient tout le monde avec la même précision'},{t:'ne fonctionnaient pas sur les hommes'},{t:'refusaient d’analyser certains visages'}],
   '<p>Jusqu’à 34,7 % d’erreurs contre 0,8 % : un biais de représentation.</p>'),
  Q('Biais','Un juge suit la recommandation d’un logiciel sans la vérifier « parce que la machine est objective ». De quel biais s’agit-il&nbsp;?',[
    {t:'Le biais d’automatisation',ok:true},{t:'Le biais de représentation'},{t:'Une hallucination'},{t:'La complaisance'}],
   '<p>Ce biais est humain : trop faire confiance à une machine. Une IA n’est pas objective par nature ; elle reflète ses données.</p>')
  ],
  notes:[
   'Derrière une réponse d’IA, il y a de l’énergie et de l’eau, une chaîne industrielle mondiale, du travail humain et des données.',
   'Aucun de ces sujets n’a de réponse simple : chacun demande de connaître des ordres de grandeur, de comparer des points de vue et de vérifier ses sources.',
   'Tu peux rejouer chaque dossier : seul ton meilleur score compte.']
};

return {
  title:'Derrière la réponse',
  pass:60,
  lead:'Derrière chaque réponse d’une IA, il y a des centres de données, de l’eau, des usines de puces, des États rivaux, des modèles qui n’ont ni le même prix ni les mêmes valeurs, des travailleurs, des auteurs et des montagnes de données. Descends strate par strate, mène l’enquête dans sept dossiers, puis passe le grand quiz. Tu peux rejouer un dossier : seul ton meilleur score compte.',
  order:['env','eau','geo','ouv','tra','don','bia','fin'],
  chapters:C,
  sources:[
   'Cours « Numérique et GES », activité 1 et corrigé (documents de l’enseignant·e) ; GIEC, 6<sup>e</sup> rapport de synthèse, 2023.',
   'Agence internationale de l’énergie, « Energy and AI », avril 2025.',
   'Google, « Measuring the environmental impact of AI inference », août 2025 ; OpenAI, juin 2025.',
   'Énergie par usage : MIT Technology Review, « We did the math on AI’s energy footprint », mai 2025 ; « Lights, Camera, Carbon » (arXiv 2607.04553), 2026 ; Strzelecki, « Generating Music, AI and Energy », 2025 ; Patterson et al., 2021 ; Epoch AI ; Horwitz, « Estimating the carbon footprint of computational fluid dynamics » (arXiv 2402.05985), 2024 ; NASA.',
   'Houston Advanced Research Center, rapport sur l’eau et les centres de données au Texas, janvier 2026 ; Université du Texas à Austin, Bureau of Economic Geology, mai 2026 ; Texas A&amp;M AgriLife, « Water Value in South Central Texas », 2019 ; Texas Farm Bureau, 2026 ; Texas Observer, février 2026 ; Inside Climate News, avril 2026.',
   'Parts de marché d’ASML, TSMC et Nvidia : Barron’s, MarketScreener, IDC cité par Reuters, 2025–2026.',
   'Contrôles à l’exportation : Bureau of Industry and Security (États-Unis), gouvernement néerlandais, ministère chinois du Commerce, US Geological Survey ; CBS News et AFP, 13 novembre 2026.',
   'Bloomberg, « A Guide to the Circular Deals Underpinning the AI Boom », octobre 2026 ; annonces Microsoft et OpenAI, octobre 2025.',
   'Modèles ouverts et prix : « The ATOM Report » (arXiv 2604.07190), 2026 ; Epoch AI ; communiqué EPFL, EPFZ et CSCS sur Apertus, septembre 2025 ; tarifs publics d’Anthropic (platform.claude.com/docs), d’OpenAI, de Mistral AI et de DeepSeek, novembre 2026 ; comparatifs de coût d’hébergement (SemiAnalysis InferenceX, 2026).',
   'Valeurs des modèles : Washington Post, 24 juin 2026 (résumé par The Decoder) ; Anthropic, « Measuring political bias in Claude », novembre 2025 ; New York Times, septembre 2025 ; Röttger et al., « Political Compass or Spinning Arrow? », ACL 2024 ; Pan et Xu, étude sur les modèles chinois ; Awad et al., Nature, 2018, et PNAS, 2020 ; Neuman, Coleman et Shah, « Analyzing the Ethical Logic of Eight Large Language Models », 2025 ; Agarwal, 2026 (prépublication) ; Institut Max-Planck, 2025 ; Cheung, Maier et Lieder, PNAS, 2025 ; Himmelreich, 2026 ; Jin et al., ICLR 2025 ; Atari, Henrich et al., « Which Humans? », 2023.',
   'Fonds monétaire international, janvier 2026 ; Forum économique mondial, « Future of Jobs Report 2025 » ; Brynjolfsson, Chandar et Chen, « Canaries in the Coal Mine? », Stanford Digital Economy Lab, 2025, révisé en août 2026.',
   'Données d’entraînement : jugements Bartz c. Anthropic et Kadrey c. Meta (juin 2025) ; accord Bartz (septembre 2025, approuvé en juillet 2026) ; Washington Post sur le projet Panama (janvier 2026) ; TechCrunch sur la lettre de CODA (novembre 2025) ; annonce Disney–OpenAI (décembre 2025) ; motion Gössi 24.4596 (Parlement suisse) ; Le Temps, SUISA.',
   'Philosophes et comportement des modèles : Anthropic, « Claude’s Constitution », janvier 2026 ; New York Times cité par Daily Nous, juillet 2026 ; Washington Times, juillet 2026 ; Varsity (Cambridge), 2026.',
   'Buolamwini et Gebru, « Gender Shades », 2018 ; Reuters, enquête sur l’outil de recrutement d’Amazon, 2018 ; UNESCO, 2024 ; ONU Femmes, juin 2026 ; Bloomberg, 2023.'],
  sourceNote:'Les chiffres sur l’IA changent vite. Ceux de ce jeu ont été vérifiés en novembre 2026 ; plusieurs sont des estimations ou des prévisions, signalées comme telles.'
};

</script>
<script>
(function(){
'use strict';

/* ================= SCORM 1.2 ================= */
var S={api:null,ok:false,t0:Date.now(),closed:false};
function findAPI(w){
  var n=0;
  while(w&&n<50){
    try{ if(w.API) return w.API; }catch(e){}
    var p=null; try{ p=w.parent; }catch(e){}
    if(!p||p===w) break;
    w=p; n++;
  }
  return null;
}
function lmsGet(k){ if(!S.ok) return ''; try{ return String(S.api.LMSGetValue(k)||''); }catch(e){ return ''; } }
function lmsSet(k,v){ if(!S.ok) return; try{ S.api.LMSSetValue(k,String(v)); }catch(e){} }
function lmsCommit(){ if(!S.ok) return; try{ S.api.LMSCommit(''); }catch(e){} }
function scormInit(){
  try{ S.api=findAPI(window); if(!S.api&&window.opener) S.api=findAPI(window.opener); }catch(e){}
  if(S.api){ try{ S.ok=String(S.api.LMSInitialize(''))==='true'; }catch(e){ S.ok=false; } }
  if(S.ok){
    var st=lmsGet('cmi.core.lesson_status');
    if(st===''||st==='not attempted'){ lmsSet('cmi.core.lesson_status','incomplete'); lmsCommit(); }
  }
}
function pad(n){ return (n<10?'0':'')+n; }
function sessionTime(){
  var s=Math.floor((Date.now()-S.t0)/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return (h<10?'000':h<100?'00':h<1000?'0':'')+h+':'+pad(m)+':'+pad(s%60);
}
function scormClose(){
  if(S.closed) return; S.closed=true;
  if(!S.ok) return;
  lmsSet('cmi.core.session_time',sessionTime());
  lmsSet('cmi.core.exit', allDone()? '' : 'suspend');
  lmsCommit();
  try{ S.api.LMSFinish(''); }catch(e){}
}

/* ================= état ================= */
var DATA=window.DLR_DATA, CH=DATA.chapters, ORDER=DATA.order;
var ST={v:1,c:{}};
var LSKEY='dlr_ia_v1';
function chState(id){ if(!ST.c[id]) ST.c[id]={b:-1,d:0,i:0,r:0}; return ST.c[id]; }
function loadState(){
  var raw='';
  if(S.ok) raw=lmsGet('cmi.suspend_data');
  else { try{ raw=window.localStorage.getItem(LSKEY)||''; }catch(e){} }
  if(raw){ try{ var o=JSON.parse(raw); if(o&&o.v===1&&o.c) ST=o; }catch(e){} }
  ORDER.forEach(chState);
}
function chMax(id){ return CH[id].steps.reduce(function(a,s){ return a+(s.pts||0); },0); }
function chScore(id){ var c=chState(id); return c.d? c.b : (c.r||0); }
function totalMax(){ return ORDER.reduce(function(a,id){ return a+chMax(id); },0); }
function totalScore(){ return ORDER.reduce(function(a,id){ return a+chScore(id); },0); }
function pct(){ return Math.round(100*totalScore()/totalMax()); }
function allDone(){ return ORDER.every(function(id){ return chState(id).d; }); }
function dossiersDone(){ return ORDER.filter(function(id){return id!=='fin';}).every(function(id){ return chState(id).d; }); }
function save(){
  var raw=JSON.stringify(ST);
  if(S.ok){
    lmsSet('cmi.suspend_data',raw);
    lmsSet('cmi.core.score.min',0); lmsSet('cmi.core.score.max',100); lmsSet('cmi.core.score.raw',pct());
    lmsSet('cmi.core.lesson_status', allDone()? (pct()>=DATA.pass?'passed':'completed') : 'incomplete');
    lmsSet('cmi.core.session_time',sessionTime());
    lmsCommit();
  } else { try{ window.localStorage.setItem(LSKEY,raw); }catch(e){} }
}

/* ================= outils DOM ================= */
function el(tag,attrs,kids){
  var e=document.createElement(tag),k;
  if(attrs) for(k in attrs){
    var v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  if(kids!=null) (Array.isArray(kids)?kids:[kids]).forEach(function(c){
    if(c==null||c===false) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ return String(n).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
var app=document.getElementById('app');
function mount(nodes,color){
  app.innerHTML='';
  app.style.setProperty('--c',color||'var(--ink)');
  nodes.forEach(function(n){ if(n) app.appendChild(n); });
  window.scrollTo(0,0);
}
function topBar(){
  return el('header',{class:'top'},[
    el('button',{class:'brand',onclick:hub,text:DATA.title}),
    el('span',{class:'pill',title:'Ton score global',text:'Score : '+pct()+' %'}),
    el('button',{class:'btn small',onclick:carnet,text:'Mon carnet'})
  ]);
}

/* ================= accueil ================= */
function stateLabel(id){
  var c=chState(id), n=CH[id].steps.length;
  if(c.d) return 'Terminé : '+c.b+' sur '+chMax(id)+' points';
  if(c.i>0) return 'En cours : étape '+(c.i+1)+' sur '+n;
  return 'À explorer';
}
function hub(){
  var strata=el('div',{class:'strata'});
  ORDER.forEach(function(id){
    var ch=CH[id], c=chState(id), locked=(id==='fin'&&!dossiersDone());
    strata.appendChild(el('button',{class:'stratum '+ch.tex+(c.d?' done':''),style:'--c:'+ch.color,disabled:locked,onclick:function(){ startChapter(id); }},[
      el('h2',{text:ch.title}),
      el('span',{class:'state',text:locked?'Verrouillé':stateLabel(id)}),
      el('p',{text:locked?ch.lockText:ch.sub})
    ]));
  });
  var surf=el('section',{class:'surface'},[
    el('div',{class:'chat','aria-hidden':'true'},[
      el('div',{class:'bub me',html:'Explique-moi la photosynthèse en trois phrases.'}),
      el('div',{class:'bub ai',html:'Bien sûr ! La photosynthèse est le processus par lequel…<small>Réponse générée en 2 secondes</small>'})
    ]),
    el('h1',{text:'Que se passe-t-il sous l’écran ?'}),
    el('p',{class:'lead',html:DATA.lead})
  ]);
  mount([topBar(),surf,strata]);
}

/* ================= déroulé d’un dossier ================= */
var run=null;
function startChapter(id){
  var c=chState(id);
  run={id:id,ch:CH[id],i:c.i||0,score:(c.i>0?c.r:0)||0};
  if(run.i>=run.ch.steps.length){ run.i=0; run.score=0; }
  renderStep();
}
function persistRun(){ var c=chState(run.id); c.i=run.i; c.r=run.score; save(); }
function goNext(){
  run.i++;
  if(run.i>=run.ch.steps.length){ endChapter(); return; }
  persistRun(); renderStep();
}
var VERD={ok:'Juste',mid:'En partie juste',ko:'Pas cette fois'};
function renderStep(){
  var ch=run.ch, step=ch.steps[run.i], n=ch.steps.length;
  var bar=el('div',{class:'stepbar'},el('div',{class:'in'},[
    el('button',{class:'back',onclick:function(){ persistRun(); hub(); },text:'Dossiers'}),
    el('span',{class:'ttl',text:ch.title}),
    el('span',{class:'cnt',text:'Étape '+(run.i+1)+' sur '+n})
  ]));
  var prog=el('div',{class:'prog'},el('i',{style:'width:'+Math.round(100*run.i/n)+'%'}));
  var box=el('div');
  var fbz=el('div',{'aria-live':'polite'});
  var art=el('article',{class:'step'},[ step.title?el('h2',{text:step.title}):null, step.html?el('div',{html:step.html}):null, step.q?el('p',{class:'q',html:step.q}):null, box, fbz ]);
  var ctx={
    step:step, box:box,
    next:goNext,
    nextBtn:function(label,disabled){
      var b=el('button',{class:'btn primary',text:label||'Continuer',disabled:!!disabled,onclick:goNext});
      return b;
    },
    finish:function(pts,o){
      o=o||{}; pts=Math.max(0,Math.min(step.pts||0,Math.round(pts)));
      run.score+=pts;
      var max=step.pts||0, verdict=o.verdict||(max? (pts>=max?'ok':pts>0?'mid':'ko') : 'none');
      var kids=[];
      if(verdict!=='none') kids.push(el('div',{class:'v'},[VERD[verdict], max?el('span',{text:'+'+pts+' sur '+max+' points'}):null]));
      if(o.html) kids.push(el('div',{html:o.html}));
      if(step.exp) kids.push(el('div',{html:step.exp}));
      if(step.src) kids.push(el('p',{class:'src',html:'Source : '+step.src}));
      var nb=ctx.nextBtn(run.i+1>=n?'Terminer le dossier':'Continuer');
      kids.push(el('div',{class:'actions'},nb));
      fbz.innerHTML='';
      fbz.appendChild(el('div',{class:'fb '+(verdict==='none'?'':verdict)},kids));
      try{ nb.focus({preventScroll:true}); nb.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){}
    }
  };
  mount([topBar(),bar,prog,el('div',{class:'wrap'},art)],ch.color);
  (R[step.type]||R.info)(ctx);
}
function endChapter(){
  var id=run.id, ch=run.ch, c=chState(id), max=chMax(id), sc=run.score;
  var first=!c.d, prev=c.b;
  c.d=1; c.b=Math.max(c.b,sc); c.i=0; c.r=0; save();
  var msg = sc>=0.85*max? 'Dossier maîtrisé.' : sc>=0.6*max? 'Bon travail. Rejoue le dossier si tu veux viser plus haut.' : 'Les notions sont dans ton carnet. Relis-les, puis rejoue le dossier : seul ton meilleur score compte.';
  var kids=[
    el('h2',{text:ch.endTitle||('Dossier terminé : '+ch.title)}),
    el('p',{class:'score',text:sc+' / '+max}),
    el('p',{text:msg+(!first&&prev>sc?' Ton meilleur score reste '+prev+'.':'')}),
    el('h3',{text:'À retenir'}),
    el('ul',{class:'notes',html:ch.notes.map(function(x){return '<li>'+x+'</li>';}).join('')})
  ];
  if(id==='fin'||allDone()){
    kids.push(el('div',{class:'fig',html:'<b class="big">Score global : '+pct()+' %</b><br>'+(allDone()?(pct()>=DATA.pass?'Tu as terminé toute l’enquête et atteint le seuil de réussite ('+DATA.pass+' %).':'Tu as terminé toute l’enquête. Le seuil de réussite est de '+DATA.pass+' % : rejoue les dossiers où tu as le moins de points.'):'')}));
  }
  kids.push(el('div',{class:'actions'},[
    el('button',{class:'btn primary',onclick:hub,text:'Retour aux dossiers'}),
    el('button',{class:'btn',onclick:function(){ startChapter(id); },text:'Rejouer ce dossier'}),
    el('button',{class:'btn',onclick:carnet,text:'Ouvrir mon carnet'})
  ]));
  mount([topBar(),el('div',{class:'wrap'},el('article',{class:'step end'},kids))],ch.color);
}

/* ================= carnet ================= */
function carnet(){
  var w=el('div',{class:'wrap carnet'});
  w.appendChild(el('div',{class:'actions noprint',style:'margin-top:8px'},[
    el('button',{class:'btn primary',onclick:hub,text:'Retour aux dossiers'}),
    el('button',{class:'btn',onclick:function(){ try{ window.print(); }catch(e){} },text:'Imprimer mon carnet'})
  ]));
  w.appendChild(el('h1',{style:'font-size:2rem;margin-top:18px',text:'Mon carnet d’enquête'}));

R.mcq=function(ctx){

R.order=function(ctx){

  do{ cur=shuffle(s.items.map(function(_,i){return i;})); } while(cur.every(function(v,i){return v===i;}));
  var ol=el('ol',{class:'olist'});
  function draw(focusIdx,dir){
    ol.innerHTML='';
    cur.forEach(function(k,pos){
      var up=el('button',{'aria-label':'Monter : '+s.items[k].t,disabled:pos===0,text:'↑',onclick:function(){ var t=cur[pos-1]; cur[pos-1]=cur[pos]; cur[pos]=t; draw(pos-1,'u'); }});
      var dn=el('button',{'aria-label':'Descendre : '+s.items[k].t,disabled:pos===n-1,text:'↓',onclick:function(){ var t=cur[pos+1]; cur[pos+1]=cur[pos]; cur[pos]=t; draw(pos+1,'d'); }});
      ol.appendChild(el('li',null,[el('span',{class:'t',html:s.items[k].t}),el('span',{class:'mv'},[up,dn])]));
      if(pos===focusIdx){ var f=(dir==='u'&&!up.disabled)?up:(dir==='d'&&!dn.disabled)?dn:(up.disabled?dn:up); setTimeout(function(){ try{f.focus();}catch(e){} },0); }
    });
  }
  draw(-1);
  var val=el('button',{class:'btn primary',text:'Valider mon classement',onclick:function(){
    var good=0,tot=0,i,j;
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){ tot++; if(cur[i]<cur[j]) good++; }
    var exact=cur.every(function(v,i){return v===i;});
    ol.innerHTML=''; val.remove(); if(hint) hint.remove();
    var maxv=s.items[0].n||1;
    s.items.forEach(function(it){
      var w=it.n? Math.max(1,Math.round(100*Math.pow(it.n/maxv,s.pow||1))) : 0;
      ol.appendChild(el('li',{class:'fix'},[el('span',{class:'t'},[el('span',{html:it.t}), it.n?el('div',{class:'bar',style:'width:'+w+'%'}):null]), it.v?el('span',{class:'val',html:it.v}):null]));
    });
    ctx.finish(s.pts*good/tot,{verdict:exact?'ok':(good/tot>=0.5?'mid':'ko'),html:exact?'':'<p>Voici le bon ordre. Tu avais bien placé '+good+' paires sur '+tot+'.</p>'});
  }});
  var hint=el('p',{class:'hint',text:s.hint||'Utilise les flèches pour déplacer chaque ligne.'});

R.match=function(ctx){

/* --- comparateur : API ou serveur local --- */
R.cost=function(ctx){
  var API=[['Claude Opus 5.5',4,20],['Claude Sonnet 5.5',2,10],['GPT-5.6 Terra',2,12],['Mistral Large 4',0.7,2.1],['DeepSeek V4.1 Flash',0.3,1.2],['Claude Haiku 5.5',0.1,0.5]];
  var SRV=3500, OPS=2000, CAP=100;

  var nOut=el('span',{class:'n'}), out=el('div',{class:'costs'}), msg=el('div',{class:'meters','aria-live':'polite'});
  function money(c){ return (c<100? fmt(Math.round(c*10)/10) : fmt(Math.round(c)))+' $'; }
  function vol(){ var v=Math.pow(10,-1+parseInt(inp.value,10)/10); return v<10? Math.round(v*10)/10 : Math.round(v); }
  function upd(){
    var v=vol(), n=Math.max(1,Math.ceil(v/CAP)), loc=OPS+n*SRV;
    var rows=API.map(function(a){ return {name:a[0],sub:fmt(a[1])+' $ lus, '+fmt(a[2])+' $ écrits',c:v*30*(0.8*a[1]+0.2*a[2])}; });
    rows.push({name:'Serveur local, modèle ouvert',sub:n+' serveur'+(n>1?'s':'')+', coût fixe',c:loc,loc:true});
    var max=0,min=Infinity; rows.forEach(function(r){ if(r.c>max) max=r.c; if(r.c<min) min=r.c; });
    nOut.textContent=fmt(v)+' M';
    out.innerHTML=rows.map(function(r){
      return '<div class="cost'+(r.loc?' loc':'')+(r.c===min?' best':'')+'"><span class="nm"><b>'+r.name+'</b><small>'+r.sub+'</small></span>'+
        '<span class="bw"><i style="width:'+Math.max(1,Math.round(100*Math.sqrt(r.c/max)))+'%"></i></span><span class="pr">'+money(r.c)+(r.c===min?' <em>le moins cher</em>':'')+'</span></div>';
    }).join('');
    var dearer=rows.filter(function(r){ return !r.loc && r.c>loc; }).map(function(r){ return r.name; });
    msg.innerHTML='<div class="meter"><b>Le serveur local travaille à '+Math.round(100*v/(n*CAP))+' % de sa capacité</b>'+(v/(n*CAP)<0.2?'Il reste inoccupé la plupart du temps, mais coûte la même somme.':'Plus il est occupé, plus son coût par token baisse.')+'</div>'+
      '<div class="meter '+(dearer.length?'g':'m')+'"><b>'+(dearer.length?'Le local coûte moins que '+dearer.length+' API sur '+API.length:'Toutes les API coûtent moins que le local')+'</b>'+(dearer.length?dearer.join(', ')+'.':'À ce volume, le coût fixe du serveur n’est pas amorti.')+'</div>';
  }
  ctx.box.appendChild(el('div',{class:'sim'},[
    el('div',{class:'row'},[el('label',{for:'ct',text:'Tokens par jour (millions)'}),inp,nOut]),
    el('p',{class:'hint',style:'margin:0',text:'Facture par mois, en dollars :'}),
    out, msg,
    el('p',{class:'hint',html:'Modèle volontairement simplifié. Hypothèses : 80 % de tokens lus et 20 % écrits ; prix publics de novembre 2026, par million de tokens ; serveur local à 3 500 $ par mois (matériel et électricité) plus 2 000 $ par mois de maintenance, capable de traiter 100 millions de tokens par jour. Ces modèles ne sont pas de qualité égale : le prix ne dit pas tout.'})
  ]));

  upd();
};

      m(fr>=0.9?'g':fr>=0.6?'m':'b','Les champs de Rosa', fr>=0.9?'Récolte normale.':fr>=0.6?'Elle laisse environ '+Math.round((1-fr)*100)+' % de ses champs sans culture.':'La plus grande partie de la récolte est perdue. Rosa envisage de vendre ses droits d’eau.')+
      m(vr>=1?'g':vr>=0.8?'m':'b','Les robinets de la ville', vr>=1?'Aucune restriction.':vr>=0.8?'Arrosage des jardins et lavage des voitures interdits.':'Coupures d’eau tournantes : un besoin vital n’est plus couvert.')+
      m(cr>=1?'g':cr>=0.4?'m':'b','Le centre de données', cr>=1?'Il tourne à plein régime, refroidi par évaporation d’eau.':cr>=0.4?'Il passe en partie au refroidissement à sec : moins d’eau, mais plus d’électricité.':'L’entreprise gèle le projet ou doit investir dans un circuit fermé : emplois et recettes fiscales retardés.')+
      m(sum<=AV?'g':'b','La nappe', sum<=AV?'Niveau stable cette année.':'Elle baisse de '+(sum-AV)+' unités. C’est une dette pour les années suivantes.')+
      m('','Argent produit (indice)', Math.round(100*money/mmax)+' % du maximum possible. Cet indicateur ne « voit » presque que le centre de données.');
  }
  var rows=['f','v','c'].map(function(k){
    inputs[k]=el('input',{type:'range',min:0,max:D[k],step:5,value:A[k],id:'w'+k,style:'accent-color:'+COL[k],oninput:function(){ A[k]=parseInt(inputs[k].value,10); upd(); }});
    nums[k]=el('span',{class:'n'});
    return el('div',{class:'row'},[el('label',{for:'w'+k,text:NAME[k]}),inputs[k],nums[k]]);
  });
  function preset(f,v,c){ return function(){ A={f:f,v:v,c:c}; upd(); }; }
  var presets=el('div',{class:'actions',style:'margin-top:0'},[
    el('span',{class:'hint',text:'Tester une règle :'}),
    el('button',{class:'btn small',text:'Au plus offrant',onclick:preset(45,25,30)}),
    el('button',{class:'btn small',text:'Droits les plus anciens d’abord',onclick:preset(60,25,15)}),
    el('button',{class:'btn small',text:'Besoins vitaux d’abord, puis partage',onclick:preset(50,25,25)})
  ]);
  var adopt=el('button',{class:'btn primary',text:'Adopter ce plan',onclick:function(){
    var sum=A.f+A.v+A.c;
    ['f','v','c'].forEach(function(k){ inputs[k].disabled=true; });
    Array.prototype.forEach.call(presets.querySelectorAll('button'),function(b){b.disabled=true;});
    adopt.remove();
    var h='<p><b>Ton plan est adopté.</b> '+(A.v<D.v?'Tu as rationné la ville : dans la réalité, presque toutes les règles de partage protègent d’abord l’eau potable. ':'Tu as protégé l’eau potable. ')+(sum>AV?'Tu as puisé plus que ce que la nappe peut fournir : tout le monde est servi aujourd’hui, mais le problème est reporté sur les années suivantes. ':'')+(A.c>=D.c&&A.f<D.f?'Le centre de données est servi en entier, pas l’agricultrice : c’est ce que donnerait un marché où l’eau va à qui paie le plus. ':'')+(A.f>=D.f&&A.c<D.c?'L’agricultrice est servie en entier, pas le centre de données : c’est ce que donne une règle de droits anciens. ':'')+'</p><p>Aucun plan ne satisfait tout le monde : il manque 15 unités. Partager l’eau, c’est choisir une règle, et chaque règle a ses gagnants et ses perdants.</p>';
    ctx.finish(0,{verdict:'none',html:h});
  }});
  ctx.box.appendChild(el('div',{class:'sim'},[presets].concat(rows).concat([gauge,tot,meters])));
  ctx.box.appendChild(el('div',{class:'actions'},adopt));
  upd();
};

/* --- simulateur : l’IA de recrutement --- */
R.hire=function(ctx){
  var C=[
    {n:'Léa',c:9,d:'capitaine de l’équipe féminine d’échecs',h:0,w:1},
    {n:'Thomas',c:7,d:'capitaine de l’équipe d’échecs',h:1,w:0},
    {n:'Inès',c:8,d:'lauréate de la bourse « Femmes et sciences »',h:0,w:1},
    {n:'Hugo',c:6,d:'stage dans une start-up',h:1,w:0},
    {n:'Samira',c:7,d:'stage dans une start-up',h:0,w:0},
    {n:'Paul',c:8,d:'membre du club de robotique',h:1,w:0}
  ];
  var MODES=[
    {id:'A',label:'Les CV des 10 dernières années, tels quels',f:function(x){return x.c+(x.h?3:0)-(x.w?2:0);},
     txt:'<b>Ce que l’IA a appris :</b> « dans le passé, les personnes embauchées étaient surtout des hommes, donc être un homme est un bon signe ». Hugo (compétences 6 sur 10) passe devant Léa (9 sur 10).'},
    {id:'B',label:'Les mêmes CV, en supprimant la case « sexe »',f:function(x){return x.c-(x.w?3:0);},
     txt:'<b>Ce que l’IA a appris :</b> elle ne voit plus la case « sexe », mais elle a remarqué que les mots « féminine » ou « femmes » étaient rares dans les CV retenus. Elle pénalise ces mots. Léa, la meilleure candidate, reste dehors.'},
    {id:'C',label:'Des CV rééquilibrés, puis un test des résultats groupe par groupe',f:function(x){return x.c;},
     txt:'<b>Ce que l’IA a appris :</b> avec autant d’exemples de femmes que d’hommes retenus, seul le niveau de compétence prédit l’embauche. Et comme l’équipe vérifie les résultats pour chaque groupe, elle verrait un nouvel écart.'}
  ];
  var tried={}, nt=0;
  var out=el('div',{'aria-live':'polite',html:'<p class="hint">Choisis un jeu de données pour entraîner l’IA, puis regarde qui elle invite en entretien.</p>'});
  var nb=ctx.nextBtn('Continuer',true), left=el('span',{class:'hint',text:'Teste au moins deux jeux de données.'});
  var btns=el('div',{class:'opts'});
  MODES.forEach(function(m){
    var b=el('button',{class:'opt',onclick:function(){
      Array.prototype.forEach.call(btns.children,function(x){x.classList.remove('sel');}); b.classList.add('sel');
      if(!tried[m.id]){ tried[m.id]=1; nt++; }
      var r=C.map(function(x,i){return {x:x,s:m.f(x),i:i};}).sort(function(a,b2){return b2.s-a.s||a.i-b2.i;});
      out.innerHTML='<h3>Classement produit par l’IA</h3><ol class="cands">'+r.map(function(o,k){
        return '<li class="'+(k<3?'in':'')+'"><span><b>'+o.x.n+'</b> — compétences '+o.x.c+' sur 10<small>'+o.x.d+'</small></span><span class="sc">'+(k<3?'Invité·e':'Écarté·e')+'</span></li>'; }).join('')+'</ol><div class="out">'+m.txt+'</div>';
      if(nt>=2){ nb.disabled=false; left.textContent=nt<3?'Tu peux encore tester le dernier.':''; }
    }},[el('span',{class:'mk',text:m.id}),el('span',{html:m.label})]);
    btns.appendChild(b);
  });
  ctx.box.appendChild(btns); ctx.box.appendChild(out);
  ctx.box.appendChild(el('p',{class:'hint',text:'Modèle volontairement simplifié : six candidatures, trois places en entretien.'}));
  ctx.box.appendChild(el('div',{class:'actions'},[nb,left]));
};
