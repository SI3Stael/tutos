:root{
  --ink:#16213E; --ink2:#47536E; --paper:#EDF2F6; --card:#FFFFFF; --line:#D3DCE6;
  --env:#2A7656; --eau:#1B6FB8; --geo:#B2304A; --tra:#A86A00; --bia:#5843AD; --fin:#262B36;
  --ok:#17764D; --okbg:#E2F3EA; --ko:#B23121; --kobg:#FBE9E5; --midbg:#FFF3D6; --mid:#8A5A00;
  --c:var(--ink);
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

/* barre du haut */
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;max-width:980px;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;background:none;border:0;padding:6px 0;margin-right:auto;text-align:left}
.pill{border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:700;background:var(--card);white-space:nowrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:9px 18px;font-weight:700}
.btn:hover:not(:disabled){background:var(--ink);color:#fff}
.btn.primary{background:var(--c);border-color:var(--c);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(.88);background:var(--c)}
.btn:disabled{opacity:.45}
.btn.small{padding:5px 12px;font-size:.92rem}

/* accueil : la surface et les strates */
.surface{max-width:980px;margin:0 auto;padding:18px 20px 44px}
.chat{max-width:440px;display:grid;gap:8px;margin-bottom:26px}
.bub{padding:10px 14px;border-radius:16px;font-size:.98rem;width:fit-content;max-width:100%}
.bub.me{background:var(--ink);color:#fff;border-bottom-right-radius:4px;justify-self:end}
.bub.ai{background:var(--card);border:2px solid var(--ink);border-bottom-left-radius:4px}
.bub small{display:block;opacity:.75;font-size:.8rem}
.surface h1{font-size:clamp(2.1rem,6.2vw,3.7rem);font-weight:800;max-width:15ch}
.surface .lead{font-size:1.12rem;max-width:56ch;margin-top:16px;color:var(--ink2)}
.strata{max-width:980px;margin:0 auto;padding:0 0 60px}
.stratum{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;width:100%;border:0;text-align:left;
  color:#fff;background-color:var(--c);padding:34px 28px 30px;margin-top:-12px;position:relative}
.stratum:nth-child(odd){clip-path:polygon(0 9px,14% 0,33% 7px,58% 1px,81% 9px,100% 3px,100% 100%,0 100%)}
.stratum:nth-child(even){clip-path:polygon(0 2px,19% 9px,42% 1px,66% 8px,88% 0,100% 7px,100% 100%,0 100%)}
.stratum:first-child{margin-top:0}
.stratum h2{font-size:clamp(1.35rem,3.4vw,1.9rem);font-weight:800}
.stratum p{grid-column:1;margin:0;max-width:58ch;opacity:.93}
.stratum .state{grid-column:2;grid-row:1 / span 2;font-weight:700;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.75);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:.92rem}
.stratum.done .state{background:#fff;color:var(--c);border-color:#fff}
.stratum:hover:not(:disabled) h2{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.stratum:disabled{opacity:1;color:rgba(255,255,255,.72)}
.stratum.t-dots{background-image:radial-gradient(rgba(255,255,255,.13) 1.6px,transparent 1.7px);background-size:15px 15px}
.stratum.t-waves{background-image:repeating-radial-gradient(circle at 50% -220%,transparent 0 26px,rgba(255,255,255,.12) 26px 29px)}
.stratum.t-lines{background-image:repeating-linear-gradient(118deg,rgba(255,255,255,.1) 0 2px,transparent 2px 15px)}
.stratum.t-grid{background-image:linear-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.09) 1.5px,transparent 1.5px);background-size:22px 22px}
.stratum.t-open{background-image:radial-gradient(circle,transparent 5px,rgba(255,255,255,.12) 5px 7px,transparent 7px);background-size:26px 26px}
.stratum.t-pages{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.11) 0 2px,transparent 2px 10px)}
.stratum.t-cross{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 13px),repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 13px)}
.stratum.t-rock{background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.3px);background-size:11px 11px,29px 29px;background-position:0 0,7px 13px}
@media(max-width:620px){.stratum{grid-template-columns:1fr;padding:30px 20px 26px}.stratum .state{grid-column:1;grid-row:3;justify-self:start;margin-top:8px}}

/* étape */
.stepbar{background:var(--c);color:#fff}
.stepbar .in{max-width:820px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepbar .back{background:none;border:2px solid rgba(255,255,255,.8);color:#fff;border-radius:8px;padding:4px 12px;font-weight:700}
.stepbar .back:hover{background:#fff;color:var(--c)}
.stepbar .ttl{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-right:auto}
.stepbar .cnt{font-size:.92rem}
.prog{height:6px;background:rgba(0,0,0,.12)}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.step{background:var(--card);border-radius:14px;border-top:8px solid var(--c);padding:26px 28px 28px;margin:26px 0 20px}
.step h2{font-size:clamp(1.4rem,3.6vw,1.85rem);font-weight:800;margin-bottom:14px}
.step h3{font-size:1.1rem;font-weight:600;margin:1.1em 0 .4em}
.step .q{font-size:1.1rem;font-weight:700;margin:14px 0 12px}
.step ul{margin:.3em 0 .9em;padding-left:1.2em}
.step li{margin:.2em 0}
.hint{color:var(--ink2);font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.fig{background:var(--paper);border-radius:10px;padding:14px 16px;margin:14px 0}
.fig b.big{font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--c)}
.src{font-size:.84rem;color:var(--ink2);margin-top:10px}
@media(max-width:620px){.step{padding:20px 18px 22px}}

/* retour */
.fb{border-radius:12px;padding:16px 18px;margin-top:18px;background:var(--paper);border-left:8px solid var(--ink2)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.fb.mid{background:var(--midbg);border-color:var(--mid)}
.fb .v{font-family:var(--display);font-weight:800;font-size:1.15rem;margin-bottom:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fb .v span{font-family:var(--body);font-size:.9rem;font-weight:700}

/* choix */
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid var(--ink2);border-radius:50%;margin-top:2px;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.sq .mk{border-radius:5px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.opt.sel .mk{background:var(--c);border-color:var(--c);color:#fff}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt.bad .mk{background:var(--ko);border-color:var(--ko);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt:disabled{opacity:1}
.opt.off{opacity:.55}
.why{font-size:.93rem;color:var(--ko);margin:8px 0 0}

/* classement */
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.olist li{counter-increment:o;display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);margin:0}
.olist li::before{content:counter(o);font-family:var(--display);font-weight:800;width:1.6em;text-align:center;color:var(--c)}
.olist .t{flex:1}
.olist .mv{display:flex;gap:4px}
.olist .mv button{width:38px;height:38px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font-weight:700;line-height:1}
.olist .mv button:hover:not(:disabled){background:var(--ink);color:#fff}
.olist .mv button:disabled{opacity:.3}
.olist li.fix{border-color:var(--c)}
.olist .val{font-weight:700;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--c);margin-top:4px;min-width:3px}

/* associations */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.match .col{display:grid;gap:10px;align-content:start}
.mi{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;text-align:left;position:relative;min-height:52px}
.mi:hover:not(:disabled){border-color:var(--c)}
.mi.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.mi.done{border-color:var(--ok);background:var(--okbg);padding-left:40px}
.mi.done::before{content:attr(data-n);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center}
.mi.no{border-color:var(--ko);background:var(--kobg)}
@media(max-width:560px){.match{gap:8px}.mi{padding:8px;font-size:.93rem}.mi.done{padding-left:36px}.mi.done::before{left:7px;top:9px}}

/* tri */
.cardx{border:2px dashed var(--c);border-radius:12px;padding:22px 18px;font-size:1.12rem;font-weight:700;text-align:center;background:color-mix(in srgb,var(--c) 6%,#fff);margin:8px 0 14px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.buckets .btn{min-height:58px}
.res{margin-top:12px;padding:10px 14px;border-radius:10px}
.res.ok{background:var(--okbg)}.res.ko{background:var(--kobg)}

/* curseur */
.sl{margin:18px 0 6px}
.sl output{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--c);display:block}
.sl input[type=range]{width:100%;accent-color:var(--c);height:34px}
.sl .ends{display:flex;justify-content:space-between;font-size:.86rem;color:var(--ink2)}

/* exploration */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.node{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 14px;text-align:left;position:relative;flex:1 1 150px}
.node b{font-family:var(--display);font-weight:800;display:block;font-size:1.05rem}
.node small{color:var(--ink2);font-size:.86rem}
.node.seen{border-color:var(--c);box-shadow:inset 0 -5px 0 var(--c)}
.node.cur{background:var(--c);color:#fff;border-color:var(--c)}
.node.cur small{color:#fff}
.detail{border-left:8px solid var(--c);background:var(--paper);border-radius:10px;padding:14px 16px;min-height:90px}

/* dilemme */
.out{margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--paper);border-left:8px solid var(--c)}

/* simulateurs */
.sim{display:grid;gap:14px}
.row{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center}
.row label{font-weight:700}
.row input[type=range]{width:100%;accent-color:var(--c);height:30px}
.row .n{font-weight:700;text-align:right;white-space:nowrap}
@media(max-width:560px){.row{grid-template-columns:1fr 70px}.row label{grid-column:1 / -1}}
.gauge{height:22px;border-radius:11px;background:var(--line);overflow:hidden;display:flex}
.gauge i{display:block;height:100%}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.meter{background:var(--paper);border-radius:10px;padding:10px 12px;border-left:6px solid var(--ink2);font-size:.95rem}
.meter.g{border-color:var(--ok)}.meter.m{border-color:#C98A12}.meter.b{border-color:var(--ko)}
.meter b{display:block}
.cands{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;counter-reset:c}
.cands li{counter-increment:c;display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:0}
.cands li::before{content:counter(c);font-family:var(--display);font-weight:800;text-align:center}
.cands li.in{border-color:var(--ok);background:var(--okbg)}
.cands small{color:var(--ink2);display:block}
.cands .sc{font-weight:700;white-space:nowrap}
.bars2{display:grid;gap:8px;margin:10px 0}
.bars2 div{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:10px;align-items:center;font-size:.95rem}
.bars2 i{display:block;height:20px;border-radius:4px;background:var(--c)}
.bars2 span b{margin-left:8px}

/* fin de dossier et carnet */
.end .score{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,8vw,3.6rem);color:var(--c);line-height:1}
.notes{padding-left:1.2em}
.notes li{margin:.45em 0}
.carnet section{background:var(--card);border-radius:14px;border-top:8px solid var(--c);padding:20px 24px;margin:18px 0}
.carnet h2{font-size:1.4rem;margin-bottom:8px}
.carnet .lock{color:var(--ink2)}
.carnet .srcs{font-size:.88rem}
.carnet .srcs li{margin:.25em 0}
.note-std{font-size:.9rem;color:var(--ink2);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top .btn,.noprint,.stepbar{display:none!important}body{background:#fff;font-size:12pt}.carnet section{border:1px solid #999;border-top:6px solid var(--c);break-inside:avoid}}

.costs{display:grid;gap:8px}
.cost{display:grid;grid-template-columns:minmax(150px,34%) 1fr minmax(96px,auto);gap:10px;align-items:center;font-size:.95rem}
.cost .nm b{display:block}.cost .nm small{color:var(--ink2);font-size:.82rem}
.cost .bw{display:block}.cost .bw i{display:block;height:18px;border-radius:4px;background:var(--ink2)}
.cost.loc .bw i{background:var(--c)}
.cost .pr{font-weight:700;text-align:right;white-space:nowrap}
.cost .pr em{display:block;font-style:normal;font-weight:600;font-size:.8rem;color:var(--ok)}
@media(max-width:620px){.cost{grid-template-columns:1fr auto}.cost .bw{grid-column:1 / -1;grid-row:2}}

.grid4{width:100%;border-collapse:separate;border-spacing:6px;margin:14px 0;font-size:.93rem}
.grid4 th{font-family:var(--display);font-weight:800;text-align:left;vertical-align:middle;padding:6px 8px}
.grid4 td{background:var(--paper);border:2px solid transparent;border-radius:10px;padding:10px 12px;vertical-align:top;width:38%}
.grid4 td.vide{background:none;width:auto}
.grid4 td.me{border-color:var(--c);box-shadow:inset 0 -5px 0 var(--c)}
.grid4 .tag{display:block;margin-top:6px;font-weight:700;color:var(--c);font-size:.82rem}
@media(max-width:620px){.grid4{font-size:.85rem;border-spacing:4px}.grid4 th,.grid4 td{padding:6px}}

</style>

<body>
<div id="app"></div>
<noscript><p style="padding:20px">Ce jeu a besoin de JavaScript pour fonctionner.</p></noscript>
<script>
window.DLR_DATA=(function(){
'use strict';
var C={};

/* =====================================================================
   DOSSIER 1 — ÉNERGIE ET CLIMAT (d’après le cours « Numérique et GES »)
   ===================================================================== */
C.env={
  title:'Énergie et climat', color:'#2A7656', tex:'t-dots',
  sub:'Ce que consomme le numérique, et ce que l’IA y ajoute.',
  steps:[
  {type:'info', title:'Le numérique n’est pas dans les nuages',
   html:`<p>Une réponse d’IA arrive en deux secondes et ne pèse rien dans ta main. Pourtant, elle a mobilisé des serveurs, de l’électricité, de l’eau et des métaux.</p>
   <p>L’impact du numérique sur l’environnement a plusieurs visages&nbsp;:</p>
   <ul><li>les gaz à effet de serre (GES)&nbsp;;</li><li>la consommation d’électricité&nbsp;;</li><li>les déchets toxiques&nbsp;;</li><li>les matériaux rares&nbsp;;</li><li>l’utilisation et la pollution de l’eau&nbsp;;</li><li>la biodiversité.</li></ul>
   <p>Ce dossier se concentre sur les deux premiers. L’eau a son propre dossier, juste en dessous.</p>
   <div class="fig"><b>Gaz à effet de serre&nbsp;:</b> des gaz présents dans l’atmosphère qui piègent la chaleur émise par la Terre après qu’elle a absorbé l’énergie du Soleil.</div>`,
   btn:'Commencer l’enquête'},

  {type:'mcq', pts:10, title:'L’effet de serre',
   q:'L’effet de serre est-il un problème en lui-même&nbsp;?',
   opts:[
    {t:'Non. C’est un phénomène naturel indispensable à la vie. Le problème vient de l’augmentation excessive de ces gaz, due en grande partie aux activités humaines.',ok:true},
    {t:'Oui. Sans effet de serre, le climat de la Terre serait idéal.',why:'Sans effet de serre, la Terre serait glaciale.'},
    {t:'Non, et il n’a aucun lien avec le réchauffement actuel.',why:'Le réchauffement actuel vient justement de son renforcement.'},
    {t:'Oui. Il est apparu avec les premières usines.',why:'L’effet de serre existe depuis bien avant l’humanité.'}],
   exp:`<p>L’effet de serre maintient une température qui permet la vie. Quand la concentration des GES augmente trop, la chaleur piégée augmente aussi&nbsp;: c’est le réchauffement climatique.</p>`,
   src:'cours « Numérique et GES ».'},

  {type:'mcq', pts:10, fixed:true, title:'Où en est-on ?',
   q:'D’après le rapport du GIEC de 2023, de combien la surface du globe s’est-elle déjà réchauffée depuis la fin du 18<sup>e</sup> siècle&nbsp;?',
   opts:[{t:'+0,1 °C'},{t:'+1,1 °C',ok:true},{t:'+3 °C'},{t:'+5 °C'}],
   exp:`<p>+1,1 °C déjà atteints, et +1,5 °C attendus dès le début des années 2030. Pour limiter le réchauffement entre 1,5 et 2 °C, il faut réduire très fortement les émissions.</p><p>La Suisse a décidé en 2019 de ramener ses émissions à <b>zéro net d’ici 2050</b>.</p>`,
   src:'GIEC, 6<sup>e</sup> rapport de synthèse (2023) ; Office fédéral de l’environnement.'},

  {type:'order', pts:10, pow:0.35, title:'Qui émet le plus ?',
   q:'Classe ces six activités, de celle qui émet le plus de gaz à effet de serre à celle qui en émet le moins.',
   items:[
    {t:'Un aller-retour Genève–Barcelone en avion', v:'≈ 205 kg CO₂eq', n:205},
    {t:'La fabrication d’un smartphone', v:'≈ 70 kg', n:70},
    {t:'Un aller-retour Genève–Lausanne en voiture', v:'≈ 28 kg', n:28.3},
    {t:'Chauffer au mazout un appartement de 100 m² non rénové pendant 24 h', v:'≈ 21 kg', n:21},
    {t:'Un steak de bœuf', v:'≈ 1,8 kg', n:1.8},
    {t:'Une heure de série en streaming', v:'≈ 0,055 kg', n:0.055}],
   exp:`<p>Les barres sont dessinées sur une échelle resserrée, sinon les dernières seraient invisibles&nbsp;: l’avion émet près de 4 000 fois plus que l’heure de streaming.</p><p>À retenir&nbsp;: pour un appareil numérique, <b>la fabrication pèse bien plus lourd que l’usage</b>. Fabriquer un smartphone émet environ 70 kg de CO₂eq&nbsp;; le recharger une fois, environ 0,002 kg.</p>`,
   src:'activité 1 et corrigé du cours (myclimate, ADEME, Le Monde, WWF).'},

  {type:'match', pts:10, title:'Les bonnes unités',
   q:'Associe chaque unité à ce qu’elle mesure.',
   pairs:[
    {a:'<b>kg CO₂eq</b>', b:'La quantité de CO₂ qui réchaufferait autant que le gaz mesuré'},
    {a:'<b>Joule (J)</b>', b:'L’unité d’énergie du Système international'},
    {a:'<b>Watt (W)</b>', b:'Une puissance : un micro-ondes, c’est environ 1 000 W'},
    {a:'<b>Wattheure (Wh)</b>', b:'Une énergie consommée : une batterie d’ordinateur portable, c’est environ 50 Wh'}],
   exp:`<p>1 W = 1 joule par seconde. 1 Wh = 3 600 J&nbsp;: c’est l’énergie d’un appareil de 1 W allumé pendant une heure. Ne confonds pas la puissance (W), qui dit à quelle vitesse on consomme, et l’énergie (Wh), qui dit combien on a consommé.</p>`,
   src:'cours « Numérique et GES ».'},

  {type:'mcq', pts:10, title:'Le poids du numérique',
   q:'Dans le monde, le numérique représente 3 à 4 % des émissions de gaz à effet de serre. C’est comparable à…',
   opts:[
    {t:'l’aviation civile',ok:true},
    {t:'la totalité du transport routier',why:'Le transport routier pèse nettement plus lourd.'},
    {t:'l’ensemble de l’agriculture mondiale',why:'L’agriculture pèse nettement plus lourd.'},
    {t:'une seule grande ville',why:'C’est beaucoup plus que cela.'}],
   exp:`<p>3 à 4 % des émissions mondiales, soit l’équivalent de l’aviation civile. Et cette part augmente avec la multiplication des appareils, des vidéos et, désormais, de l’IA.</p>`,
   src:'cours « Numérique et GES » (ARCEP, ADEME).'},

  {type:'calc', title:'Et une question posée à une IA ?',
   html:`<p>En 2025, deux entreprises ont publié leurs propres mesures pour une requête en texte&nbsp;:</p>
   <div class="fig"><b class="big">0,24 Wh</b> pour Google (Gemini), avec 0,03 g de CO₂eq et 0,26 mL d’eau, soit cinq gouttes.<br><b class="big">0,34 Wh</b> pour OpenAI (ChatGPT).</div>
   <p>Dix requêtes consommeraient donc environ 3 Wh&nbsp;: moins qu’une recharge de téléphone. Des estimations plus anciennes donnaient dix fois plus. Ces chiffres sont déclarés par les entreprises elles-mêmes, et ils ne comptent ni l’entraînement des modèles ni la fabrication du matériel.</p>
   <p>Alors, négligeable&nbsp;? Fais varier le nombre de requêtes reçues chaque jour par un service d’IA.</p>`},

  {type:'mcq', pts:10, title:'Petit geste, grande échelle',
   q:'Une requête consomme très peu. Pourquoi l’IA pèse-t-elle quand même sur l’énergie et le climat&nbsp;?',
   opts:[
    {t:'Parce qu’il y a des milliards de requêtes par jour, et qu’il faut aussi entraîner les modèles, construire les centres de données et fabriquer les puces.',ok:true},
    {t:'Parce que chaque requête consomme autant qu’un vol en avion.',why:'Non : une requête en texte, c’est une fraction de wattheure.'},
    {t:'Parce que les réponses sont stockées pour toujours sur ton téléphone.',why:'Le stockage sur ton téléphone n’est pas en cause.'},
    {t:'Elle ne pèse pas : le numérique est immatériel.',why:'Le numérique repose sur du matériel, de l’électricité et de l’eau.'}],
   exp:`<p>C’est l’<b>effet d’échelle</b>&nbsp;: un tout petit chiffre multiplié par des milliards devient très grand. S’y ajoutent l’entraînement des modèles, les images et vidéos générées (bien plus gourmandes que le texte) et la fabrication des serveurs.</p><p>Il y a aussi l’<b>effet rebond</b>&nbsp;: quand un service devient plus efficace et moins cher, on l’utilise davantage.</p>`,
   src:'Google, « Measuring the environmental impact of AI inference » (août 2025) ; OpenAI (juin 2025).'},

  {type:'order', pts:10, pow:0.1, title:'Texte, image, musique, film',
   q:'Tout ce qu’une IA produit ne coûte pas la même énergie. Classe ces cinq opérations, de la plus gourmande à la plus sobre.',
   items:[
    {t:'Entraîner un grand modèle de langage', v:'≈ 50 GWh (estimation pour GPT-4)', n:5e10},
    {t:'Générer un film de 15 minutes', v:'3 à 50 kWh (extrapolation)', n:15000},
    {t:'Générer un morceau de musique de 10 minutes', v:'10 Wh à 1 kWh (très incertain)', n:100},
    {t:'Générer une image', v:'0,5 à 3 Wh', n:1.2},
    {t:'Poser une question en texte', v:'≈ 0,3 Wh', n:0.3}],
   exp:`<p>Les barres sont très resserrées&nbsp;: entre une question en texte et l’entraînement d’un modèle, il y a un facteur de plus de cent milliards.</p>
   <ul><li><b>Image&nbsp;:</b> environ 0,6 Wh mesuré sur un modèle ouvert, jusqu’à 3 Wh selon d’autres mesures. C’est deux à dix questions en texte.</li>
   <li><b>Vidéo&nbsp;:</b> un clip de 8 secondes consomme entre 30 et 420 Wh selon le modèle. Un film de 15 minutes, c’est plus de cent clips mis bout à bout&nbsp;: de 3 à 50 kWh, soit jusqu’à quatre jours d’électricité d’un ménage suisse. Personne n’a publié de mesure pour un film entier&nbsp;: ce chiffre est une extrapolation.</li>
   <li><b>Musique&nbsp;:</b> aucune entreprise ne publie de chiffres. Une étude sur un modèle ouvert donne moins de 10 Wh pour dix minutes&nbsp;; d’autres estimations, non vérifiées, donnent cent fois plus.</li>
   <li><b>Entraînement&nbsp;:</b> environ 1,3 GWh pour GPT-3 (2020), environ 50 GWh pour GPT-4 (2023), soit la consommation annuelle de 11&nbsp;000 ménages suisses. Mais on n’entraîne un modèle qu’une fois, alors qu’il répond ensuite à des milliards de requêtes&nbsp;: on estime aujourd’hui que l’usage consomme davantage que l’entraînement.</li></ul>
   <p>Règle pratique&nbsp;: <b>plus le résultat contient de données, plus il coûte</b>. Texte, puis image, puis son, puis vidéo.</p>`,
   src:'MIT Technology Review, mai 2025&nbsp;; « Lights, Camera, Carbon », 2026&nbsp;; Strzelecki, 2025&nbsp;; Patterson et al., 2021&nbsp;; Epoch AI.'},

  {type:'mcq', pts:10, title:'Et une aile d’avion ?',
   q:'Bien avant l’IA générative, les supercalculateurs servaient à simuler. Calculer l’écoulement de l’air autour d’une aile d’avion, pour une seule condition de vol, demande de l’ordre de 1&nbsp;000 heures de cœur de processeur, soit environ 10 kWh. À quoi cela correspond-il&nbsp;?',
   opts:[
    {t:'À des dizaines de milliers de questions en texte, ou à un film généré d’un quart d’heure.',ok:true},
    {t:'À une seule question en texte.',why:'Une question en texte, c’est environ 0,3 Wh : 30 000 fois moins.'},
    {t:'À l’entraînement d’un grand modèle de langage.',why:'L’entraînement se compte en gigawattheures : des millions de fois plus.'},
    {t:'À rien : un calcul scientifique ne consomme pas d’énergie.',why:'Tout calcul consomme de l’électricité.'}],
   exp:`<p>10 kWh, c’est plus de 30&nbsp;000 questions en texte. Et un avion ne se conçoit pas avec un seul calcul&nbsp;: il en faut des milliers, pour chaque vitesse et chaque angle. Pour un avion complet, avec un maillage fin, chaque calcul dépasse 100 kWh.</p><p>Mais ces calculs remplacent des essais en soufflerie, encore plus gourmands&nbsp;: chez Boeing, le nombre d’essais d’ailes en soufflerie est passé de 77 à 10 entre la fin des années 1970 et la fin des années 1990. La bonne question n’est donc pas seulement «&nbsp;combien ça consomme&nbsp;?&nbsp;», mais aussi «&nbsp;<b>à quoi ça sert, et qu’est-ce que ça remplace&nbsp;?</b>&nbsp;».</p>`,
   src:'ordres de grandeur calculés d’après des temps de calcul publiés par la NASA&nbsp;; Horwitz, « Estimating the carbon footprint of computational fluid dynamics », 2024.'},

  {type:'slider', pts:10, min:400, max:2000, stepv:5, start:500, answer:945, tol:100, unit:'TWh',
   title:'Les centres de données en 2030',
   q:'En 2024, les centres de données du monde ont consommé 415 TWh d’électricité, environ sept fois la consommation de la Suisse. Combien consommeront-ils en 2030, d’après l’Agence internationale de l’énergie&nbsp;?',
   exp:`<p>Environ <b>945 TWh</b>&nbsp;: plus du double, et un peu plus que la consommation actuelle du Japon. L’IA est le principal moteur de cette hausse.</p><p>En 2024, les centres de données représentaient environ 1,5 % de l’électricité mondiale, dont 45 % aux États-Unis et 25 % en Chine. Un centre de 100 mégawatts consomme autant que 100 000 ménages.</p>`,
   src:'Agence internationale de l’énergie, « Energy and AI » (avril 2025).'},

  {type:'sort', pts:10, title:'Que faire ?',
   q:'Ce geste réduit-il vraiment l’empreinte du numérique&nbsp;?',
   buckets:[{id:'y',label:'Oui, c’est efficace'},{id:'n',label:'Effet faible ou trompeur'}],
   cards:[
    {t:'Garder son téléphone deux ans de plus', b:'y', why:'La fabrication est le plus gros poste : allonger la durée de vie du matériel est le geste numéro un.'},
    {t:'Faire réparer son écran plutôt que racheter un appareil', b:'y', why:'Réparer, donner, acheter d’occasion : tout ce qui évite une fabrication compte beaucoup.'},
    {t:'Regarder une vidéo en Wi-Fi plutôt qu’en 4G ou 5G', b:'y', why:'Le filaire consomme moins que le Wi-Fi, et le Wi-Fi moins que le réseau mobile.'},
    {t:'Baisser la qualité d’une vidéo qu’on écoute sans la regarder', b:'y', why:'Moins de données échangées, moins d’énergie. Dégrader la qualité quand c’est pertinent est un bon réflexe.'},
    {t:'Envoyer un lien plutôt qu’une grosse pièce jointe', b:'y', why:'Le fichier n’est stocké qu’une fois au lieu d’être copié dans chaque boîte mail.'},
    {t:'Faire le tri dans son cloud, ses mails et ses conversations', b:'y', why:'Réduire les données stockées réduit le travail des centres de données.'},
    {t:'Changer de smartphone chaque année pour un modèle « plus économe »', b:'n', why:'Fabriquer l’appareil émet environ 70 kg de CO₂eq. Aucune économie à l’usage ne compense une fabrication de plus.'},
    {t:'Débrancher son chargeur la nuit, sans rien changer d’autre', b:'n', why:'Une recharge complète, c’est environ 0,002 kg de CO₂eq. Le geste n’est pas mauvais, mais son effet est minuscule face à la fabrication.'}],
   exp:`<p>Les trois leviers du cours&nbsp;: <b>faire durer le matériel</b>, <b>réduire la taille des données</b> échangées et stockées, et préférer <b>le filaire au Wi-Fi, le Wi-Fi à la 4G ou 5G</b>.</p>`,
   src:'cours « Numérique et GES ».'}
  ],
  notes:[
   'L’effet de serre est naturel et indispensable ; le problème est l’excès de GES dû aux activités humaines. Réchauffement déjà atteint : +1,1 °C. Objectif suisse : zéro net en 2050.',
   'Unités : le <b>kg CO₂eq</b> compare les gaz entre eux ; le <b>watt</b> mesure une puissance, le <b>wattheure</b> une énergie (1 Wh = 3 600 J).',
   'Ordres de grandeur : avion Genève–Barcelone aller-retour ≈ 205 kg CO₂eq, fabrication d’un smartphone ≈ 70 kg, une heure de streaming ≈ 0,055 kg.',
   'Le numérique représente 3 à 4 % des émissions mondiales, autant que l’aviation civile. Pour un appareil, la fabrication pèse bien plus que l’usage.',
   'Une requête d’IA en texte : environ 0,3 Wh selon les entreprises (2025). L’enjeu vient de l’<b>effet d’échelle</b>, de l’entraînement des modèles et du matériel.',
   'Par usage : image ≈ 0,5 à 3 Wh ; musique de 10 minutes ≈ 10 Wh à 1 kWh (très incertain) ; film de 15 minutes ≈ 3 à 50 kWh (extrapolation) ; simulation d’une aile ≈ 10 kWh par calcul ; entraînement d’un grand modèle ≈ 50 GWh. Plus le résultat contient de données, plus il coûte.',
   'Centres de données : 415 TWh en 2024, environ 945 TWh prévus en 2030 (AIE).',
   'Agir : faire durer le matériel, réduire les données, préférer le filaire et le Wi-Fi au réseau mobile.']
};

/* =====================================================================
   DOSSIER 2 — MISSION TEXAS : À QUI L’EAU ?
   ===================================================================== */
C.eau={
  title:'À qui l’eau ? Mission Texas', color:'#1B6FB8', tex:'t-waves',
  sub:'Une nappe, une sécheresse, trois usagers : à toi de partager.',
  steps:[
  {type:'info', title:'Des serveurs qui ont soif',
   html:`<p>Un centre de données chauffe en permanence. Pour le refroidir, beaucoup d’installations évaporent de l’eau. Il faut aussi de l’eau pour produire l’électricité qu’elles consomment.</p>
   <p>Le Texas est devenu l’un des grands pôles de l’IA aux États-Unis&nbsp;: plus de 300 centres de données y fonctionnent, et plus de 240 autres sont en construction ou en projet. L’État connaît aussi des sécheresses répétées et des nappes souterraines qui baissent.</p>
   <div class="fig"><b class="big">≈ 95 millions de m³</b> d’eau par an pour les centres de données texans en 2025 (25 milliards de gallons).<br><b class="big">jusqu’à 610 millions de m³</b> en 2030 (161 milliards de gallons).</div>
   <p>Aujourd’hui, cela représente moins de 1 % de l’eau utilisée dans l’État. Des chercheurs de l’Université du Texas estiment que cette part pourrait atteindre 3 à 9 % en 2040. L’irrigation agricole, elle, utilise entre 50 et 60 % de l’eau.</p>
   <p>Début 2026, le Texas n’obligeait pas les centres de données à déclarer leur consommation d’eau.</p>
   <p class="src">Sources : Houston Advanced Research Center (janvier 2026) ; Université du Texas à Austin, Bureau of Economic Geology (mai 2026) ; Texas Farm Bureau (2026) ; Texas Observer (février 2026).</p>`,
   btn:'Rencontrer les usagers'},

  {type:'explore', title:'Quatre voix autour d’une même nappe',
   html:`<p>Bienvenue dans un comté imaginaire de l’ouest du Texas. Les personnages sont inventés, leurs arguments sont ceux qu’on entend vraiment dans le débat texan.</p>`,
   prompt:'Écoute les quatre personnes avant de décider.',
   items:[
    {label:'Rosa', sub:'agricultrice, coton et sorgho',
     html:`<p>« Sans eau, pas de récolte. J’irrigue depuis la nappe, comme mon père avant moi. Mais un mètre cube d’eau me rapporte peu&nbsp;: je ne peux pas le payer cher. Si l’eau part au plus offrant, je suis la première à tomber. »</p><p><b>Pour elle, l’eau vaut</b> la récolte qu’elle permet, et la survie de sa ferme.</p>`},
    {label:'Darnell', sub:'habitant de la ville voisine',
     html:`<p>« L’eau du robinet, c’est boire, cuisiner, se laver. On ne peut pas s’en passer un seul jour. Ma facture augmente déjà. Je veux bien des emplois, mais je veux d’abord savoir combien d’eau ce centre va prendre. »</p><p><b>Pour lui, l’eau vaut</b> bien plus que son prix&nbsp;: c’est un besoin vital.</p>`},
    {label:'Priya', sub:'directrice du centre de données',
     html:`<p>« Nos serveurs produisent énormément de valeur avec chaque mètre cube. Nous pouvons payer l’eau bien plus cher que les autres, nous créons des emplois et des recettes fiscales. Nous pouvons aussi refroidir en circuit fermé ou avec des eaux usées recyclées, mais cela coûte plus cher et consomme plus d’électricité. »</p><p><b>Pour elle, l’eau vaut</b> un coût parmi d’autres, facile à absorber.</p>`},
    {label:'Sam', sub:'hydrologue du district',
     html:`<p>« La nappe se recharge lentement. Cette année, elle peut fournir 100 unités sans baisser. Tout ce qu’on pompe en plus manquera demain, à tout le monde. Et la nappe n’a personne pour défendre ses intérêts. »</p><p><b>Pour lui, l’eau vaut</b> aussi pour celles et ceux qui viendront après.</p>`}]},

  {type:'order', pts:10, hint:'Classe du montant le plus élevé au plus faible.',
   title:'Le même mètre cube, trois valeurs',
   q:'Au Texas, combien d’argent représentent 1 000 m³ d’eau selon l’usage&nbsp;?',
   items:[
    {t:'Dans une activité commerciale : la richesse produite', v:'≈ 100 000 à 270 000 $'},
    {t:'En ville : le prix facturé pour l’eau potable', v:'≈ 900 à 1 800 $'},
    {t:'Dans un champ irrigué : la valeur de récolte gagnée', v:'≈ 70 à 380 $'}],
   exp:`<p>Le même mètre cube « vaut » donc plusieurs centaines de fois plus dans un usage que dans un autre. Une entreprise très rentable, comme un centre de données, peut payer son eau bien plus cher qu’une agricultrice.</p><p>Mais attention&nbsp;: ces chiffres mesurent de l’argent. Ils ne disent rien de la valeur de l’eau qu’on boit, de la nourriture produite ou d’une nappe préservée.</p><p class="hint">Ce sont des ordres de grandeur, convertis depuis des dollars par acre-pied (1 acre-pied ≈ 1 233 m³).</p>`,
   src:'Université du Texas à Austin, Bureau of Economic Geology ; Texas A&amp;M AgriLife, « Water Value in South Central Texas » (2019).'},

  {type:'water', title:'À toi de partager',
   html:`<p>Année de sécheresse. La nappe peut fournir <b>100 unités</b> sans baisser. Les demandes atteignent 115&nbsp;: 60 pour la ferme de Rosa, 25 pour la ville, 30 pour le centre de données.</p><p>Déplace les curseurs, ou teste une règle toute faite, puis adopte ton plan. Il n’y a pas de points en jeu ici.</p>`},

  {type:'match', pts:10, title:'Trois règles, trois résultats',
   q:'Associe chaque règle de partage à ce qu’elle produit.',
   pairs:[
    {a:'<b>Au plus offrant</b> : l’eau va à qui paie le plus', b:'Le centre de données est servi en premier ; l’agricultrice réduit ses cultures ou vend ses droits'},
    {a:'<b>Droits les plus anciens d’abord</b> : premier arrivé, premier servi', b:'La ferme installée depuis longtemps passe avant le nouveau venu, même si celui-ci produit plus de richesse'},
    {a:'<b>Besoins vitaux d’abord</b>, puis partage du reste', b:'La ville est servie en entier ; ferme et centre de données réduisent tous les deux'}],
   exp:`<p>Aucune règle n’est « neutre »&nbsp;: chacune désigne des gagnants et des perdants. Choisir une règle est une décision politique.</p><p>Au Texas, les eaux de surface suivent le principe « premier arrivé, premier servi ». Pour les eaux souterraines, le propriétaire d’un terrain peut en principe pomper l’eau qui se trouve dessous, dans les limites fixées par des districts locaux.</p>`},

  {type:'mcq', pts:10, title:'Prix et valeur',
   q:'Pourquoi le prix de l’eau ne suffit-il pas à dire ce qu’elle vaut&nbsp;?',
   opts:[
    {t:'Parce que certains usages sont vitaux ou collectifs (boire, se nourrir, préserver la nappe) et ne se mesurent pas à ce que chacun peut payer.',ok:true},
    {t:'Parce que l’eau est gratuite partout dans le monde.',why:'L’eau a presque toujours un coût : pompage, traitement, transport.'},
    {t:'Parce que les centres de données n’utilisent pas vraiment d’eau.',why:'Beaucoup en utilisent pour se refroidir, directement ou via la production d’électricité.'},
    {t:'Parce que le prix est toujours fixé par les agriculteurs.',why:'Les prix dépendent des droits d’eau, des fournisseurs et des règles locales.'}],
   exp:`<p>Le <b>prix</b> est ce qu’on paie. La <b>valeur</b> dépend de l’usage et de la personne&nbsp;: vitale pour l’habitant, condition de survie de la ferme, simple coût pour une entreprise très rentable. C’est pour cela que l’eau n’est presque jamais partagée par le seul marché.</p>`},

  {type:'multi', pts:10, title:'Réduire le conflit',
   q:'Quelles mesures peuvent réellement réduire la tension sur l’eau&nbsp;?',
   opts:[
    {t:'Refroidir en circuit fermé ou avec des eaux usées recyclées plutôt qu’avec de l’eau potable',ok:true},
    {t:'Obliger les centres de données à publier leur consommation d’eau',ok:true},
    {t:'Tenir compte de l’eau disponible avant de choisir où construire',ok:true},
    {t:'Inclure les centres de données dans la planification de l’eau à long terme',ok:true},
    {t:'Pomper plus profond dans la nappe pour servir tout le monde'},
    {t:'Ne plus mesurer les prélèvements pour éviter les disputes'}],
   exp:`<p>Pomper plus profond reporte le problème sur les années suivantes. Et sans mesure, impossible de décider&nbsp;: plusieurs rapports texans réclament justement plus de transparence et une planification commune.</p><p>Les exploitants font valoir que les installations récentes consomment bien moins d’eau que les anciennes. Les agriculteurs et les habitants demandent de pouvoir le vérifier.</p>`,
   src:'Université du Texas à Austin (mai 2026) ; Houston Advanced Research Center (janvier 2026) ; Inside Climate News (avril 2026).'}
  ],
  notes:[
   'Un centre de données consomme de l’eau pour se refroidir, et indirectement pour produire son électricité.',
   'Texas : environ 95 millions de m³ par an en 2025 pour les centres de données, jusqu’à 610 millions en 2030 selon une estimation. Moins de 1 % de l’eau de l’État aujourd’hui, peut-être 3 à 9 % en 2040. L’irrigation en utilise 50 à 60 %.',
   'Le même mètre cube d’eau a une <b>valeur très différente selon l’usage</b> : quelques dizaines de centimes de récolte pour une agricultrice, des centaines de dollars de richesse pour une entreprise, un besoin vital pour un habitant.',
   '<b>Prix</b> et <b>valeur</b> ne sont pas la même chose : ce qui est vital ou collectif ne se mesure pas à ce que chacun peut payer.',
   'Partager une ressource rare, c’est choisir une règle (au plus offrant, droits anciens, besoins vitaux d’abord). Chaque règle a ses gagnants et ses perdants.',
   'Pistes : circuit fermé, eaux recyclées, transparence sur les consommations, choix du lieu d’implantation.']
};

/* =====================================================================
   DOSSIER 3 — PUCES ET PUISSANCES
   ===================================================================== */
C.geo={
  title:'Puces et puissances', color:'#B2304A', tex:'t-grid',
  sub:'ASML, TSMC, Nvidia, les géants du cloud, Washington et Pékin : qui dépend de qui.',
  steps:[
  {type:'explore', title:'La chaîne derrière un chatbot',
   html:`<p>Pour qu’une IA te réponde, il faut un modèle. Ce modèle tourne dans un centre de données, rempli de puces, sorties d’une usine, elle-même équipée de machines. À chaque maillon, une poignée d’entreprises seulement.</p>`,
   prompt:'Pars du chatbot et remonte la chaîne jusqu’à la machine. Ouvre les six fiches.',
   items:[
    {label:'OpenAI et Anthropic', sub:'Maillon 1 : les modèles (États-Unis)',
     html:`<p>OpenAI crée ChatGPT, Anthropic crée Claude. Ces laboratoires entraînent les modèles, mais ils louent l’essentiel de leur puissance de calcul aux géants du cloud.</p><p>Et ces géants sont aussi leurs actionnaires&nbsp;: Microsoft détenait environ 27 % d’OpenAI fin 2025&nbsp;; Amazon et Google ont investi des milliards dans Anthropic&nbsp;; Nvidia a investi dans les deux.</p>`},
    {label:'Microsoft, Amazon, Google', sub:'Maillon 2 : le cloud (États-Unis)',
     html:`<p>Ces trois géants possèdent les centres de données. Ils achètent les puces par centaines de milliers et louent la puissance de calcul aux autres&nbsp;: c’est le « cloud ».</p><p>Ils font partie des GAFAM (Google, Apple, Facebook devenu Meta, Amazon, Microsoft). Ils dessinent aussi leurs propres puces pour moins dépendre de Nvidia… et les font fabriquer par TSMC. Google et Meta développent en plus leurs propres modèles d’IA.</p>`},
    {label:'Nvidia', sub:'Maillon 3 : les puces (États-Unis)',
     html:`<p>Nvidia conçoit les processeurs graphiques (GPU) qui entraînent et font tourner la plupart des IA. Elle détient environ 80 % de ce marché selon les estimations.</p><p>Mais Nvidia <b>ne possède pas d’usine</b>&nbsp;: ses puces sont fabriquées par TSMC, sur des machines ASML.</p>`},
    {label:'TSMC', sub:'Maillon 4 : l’usine (Taïwan)',
     html:`<p>TSMC fabrique les puces que d’autres entreprises dessinent. Elle produit environ 70 % des puces fabriquées en sous-traitance dans le monde, et <b>environ 90 % des plus avancées</b>.</p><p>Ses usines principales sont à Taïwan, une île située à moins de 200 km des côtes chinoises. La Chine considère Taïwan comme une partie de son territoire&nbsp;; Taïwan a son propre gouvernement élu. TSMC construit aussi des usines aux États-Unis.</p>`},
    {label:'ASML', sub:'Maillon 5 : les machines (Pays-Bas)',
     html:`<p>ASML est <b>la seule entreprise au monde</b> à fabriquer les machines de lithographie « EUV » (ultraviolet extrême), qui gravent les circuits les plus fins. Sans elles, pas de puce de pointe.</p><p>Ses machines les plus récentes peuvent coûter plus de 400 millions de dollars pièce. Depuis 2019, le gouvernement néerlandais n’autorise pas leur vente à la Chine.</p>`},
    {label:'La Chine', sub:'Hors chaîne : une filière parallèle',
     html:`<p>Privée des puces et des machines les plus avancées, la Chine construit sa propre chaîne&nbsp;: Huawei pour les puces, SMIC pour la fabrication, DeepSeek ou Alibaba pour les modèles.</p><p>Au premier semestre 2026, Nvidia ne détenait plus que 34 % du marché chinois des puces d’IA, contre 28 % pour Huawei. La Chine contrôle en revanche une grande partie des métaux nécessaires à l’électronique.</p>`}]},

  {type:'match', pts:10, title:'Qui fait quoi ?',
   q:'Associe chaque acteur à son rôle dans la chaîne.',
   pairs:[
    {a:'<b>ASML</b> (Pays-Bas)', b:'Construit les machines qui gravent les puces les plus fines'},
    {a:'<b>TSMC</b> (Taïwan)', b:'Fabrique les puces dessinées par d’autres'},
    {a:'<b>Nvidia</b> (États-Unis)', b:'Conçoit les puces d’IA, sans posséder d’usine'},
    {a:'<b>Microsoft, Amazon, Google</b>', b:'Possèdent les centres de données et louent la puissance de calcul'},
    {a:'<b>OpenAI, Anthropic</b>', b:'Entraînent les modèles comme ChatGPT et Claude'}],
   exp:`<p>Aucune de ces entreprises ne peut fonctionner sans les autres. C’est ce qui rend la chaîne à la fois très efficace et très fragile.</p>`},

  {type:'mcq', pts:10, title:'Le goulet d’étranglement',
   q:'Les usines de TSMC à Taïwan s’arrêtent du jour au lendemain. Qui est touché&nbsp;?',
   opts:[
    {t:'Presque tout le monde : Nvidia, les géants du cloud, les laboratoires d’IA, les fabricants de téléphones… et l’économie mondiale.',ok:true},
    {t:'Seulement Taïwan.',why:'TSMC fabrique des puces pour le monde entier.'},
    {t:'Seulement la Chine.',why:'Les clients de TSMC sont d’abord américains.'},
    {t:'Personne : ASML prendrait le relais.',why:'ASML construit des machines, pas des puces.'}],
   exp:`<p>Environ 90 % des puces les plus avancées sortent d’une seule entreprise, sur une île au cœur des tensions entre Pékin et Washington. On parle de <b>goulet d’étranglement</b>&nbsp;: un point unique dont dépend toute la chaîne.</p><p>C’est pourquoi les États-Unis, l’Europe et le Japon subventionnent la construction d’usines sur leur sol.</p>`,
   src:'données de marché 2025–2026 (Barron’s, MarketScreener).'},

  {type:'mcq', pts:10, title:'Suis l’argent',
   q:'Début 2026, Nvidia investit 30 milliards de dollars dans OpenAI. À quoi sert une grande partie de l’argent d’OpenAI&nbsp;?',
   opts:[
    {t:'À acheter ou louer de la puissance de calcul, donc des puces… Nvidia.',ok:true},
    {t:'À construire ses propres usines de puces à Taïwan.',why:'OpenAI ne fabrique pas de puces.'},
    {t:'À racheter ASML.',why:'Ce n’est pas le cas.'},
    {t:'À rembourser ses utilisateurs.',why:'Non.'}],
   exp:`<p>On parle d’<b>accords circulaires</b>&nbsp;: le fournisseur finance son client, qui lui achète ses produits.</p>
   <ul><li>Microsoft détenait environ 27 % d’OpenAI fin 2025, et OpenAI s’est engagée à lui acheter pour 250 milliards de dollars de cloud.</li><li>Amazon a investi des milliards dans Anthropic, qui s’est engagée à dépenser plus de 100 milliards chez Amazon.</li><li>Nvidia a investi dans OpenAI et dans Anthropic, qui utilisent ses puces.</li></ul>
   <p>Certains analystes y voient un risque&nbsp;: si la demande réelle ne suit pas, tous tombent ensemble. D’autres répondent que la demande est bien là et que ces accords servent à construire assez vite.</p>`,
   src:'Bloomberg, « A Guide to the Circular Deals Underpinning the AI Boom » (octobre 2026) ; annonces Microsoft–OpenAI (octobre 2025).'},

  {type:'order', pts:10, hint:'Classe du plus ancien au plus récent.',
   title:'Washington, Pékin et les puces',
   q:'Remets ces cinq événements dans l’ordre chronologique.',
   items:[
    {t:'Les Pays-Bas, sous pression américaine, bloquent la vente des machines EUV d’ASML à la Chine', v:'2019'},
    {t:'Les États-Unis restreignent l’exportation vers la Chine des puces d’IA les plus puissantes et des équipements pour les fabriquer', v:'2022'},
    {t:'La Chine soumet à autorisation l’exportation de gallium et de germanium, deux métaux utiles aux puces', v:'2023'},
    {t:'La Chine étend ses contrôles à plusieurs terres rares', v:'2025'},
    {t:'Les États-Unis autorisent au cas par cas la vente de certaines puces Nvidia à la Chine, contre une taxe de 25 %', v:'2026'}],
   exp:`<p>Chaque mesure appelle une réponse&nbsp;: c’est une escalade. Washington vise ce que la Chine ne sait pas encore produire (puces, machines). Pékin vise ce que les États-Unis doivent importer (métaux).</p><p>En novembre 2026, le débat est relancé à Washington&nbsp;: des soupçons de détournement de puces vers la Chine par des intermédiaires poussent des élus à réclamer des contrôles plus stricts. Pékin dénonce un « abus » des contrôles à l’exportation. L’affaire est en cours&nbsp;: vérifie l’actualité.</p>`,
   src:'Bureau of Industry and Security (États-Unis) ; gouvernement néerlandais ; ministère chinois du Commerce ; CBS News et AFP (13 novembre 2026).'},

  {type:'sort', pts:10, title:'Qui tient quel levier ?',
   q:'De quel côté se trouve aujourd’hui ce maillon de la chaîne&nbsp;?',
   buckets:[{id:'u',label:'États-Unis et partenaires'},{id:'c',label:'Chine'}],
   cards:[
    {t:'Concevoir les puces d’IA les plus puissantes', b:'u', why:'Nvidia et AMD sont des entreprises américaines.'},
    {t:'Construire les machines EUV', b:'u', why:'ASML est néerlandaise, et les Pays-Bas appliquent des restrictions proches de celles de Washington.'},
    {t:'Fabriquer les puces les plus fines', b:'u', why:'TSMC, à Taïwan, en produit environ 90 %.'},
    {t:'Posséder les plus grands services de cloud', b:'u', why:'Microsoft, Amazon et Google sont américaines.'},
    {t:'Produire presque tout le gallium du monde', b:'c', why:'La Chine assure la quasi-totalité de la production mondiale de ce métal.'},
    {t:'Raffiner la grande majorité des terres rares', b:'c', why:'C’est le principal moyen de pression de Pékin dans les négociations.'},
    {t:'Développer des puces de remplacement sous embargo', b:'c', why:'Huawei progresse vite : 28 % du marché chinois des puces d’IA au premier semestre 2026.'}],
   exp:`<p>Chaque camp tient quelque chose dont l’autre a besoin. On parle d’<b>interdépendance</b>&nbsp;: elle rend un conflit ouvert très coûteux pour tous, mais elle donne aussi à chacun un moyen de pression.</p>`,
   src:'US Geological Survey ; IDC cité par Reuters (octobre 2026).'},

  {type:'match', pts:10, title:'Quatre points de vue',
   q:'Qui défend cet argument&nbsp;? Aucun n’est « le bon »&nbsp;: l’objectif est de savoir les reconnaître.',
   pairs:[
    {a:'« Limiter l’accès de la Chine aux puces protège notre sécurité nationale et notre avance. »', b:'Les partisans des contrôles à Washington'},
    {a:'« Ces contrôles sont un abus qui perturbe les chaînes d’approvisionnement mondiales. »', b:'Le gouvernement chinois'},
    {a:'« Si nous ne vendons plus, la Chine développera ses propres puces et nous perdrons ce marché. »', b:'Des industriels américains des puces'},
    {a:'« Nous avons les machines, mais ni les grands clouds ni les grands modèles : nous dépendons des autres. »', b:'De nombreux responsables européens'}],
   exp:`<p>Ces quatre positions existent vraiment dans le débat public. Comprendre un conflit, c’est d’abord pouvoir exposer honnêtement l’argument de chacun, y compris ceux avec lesquels on n’est pas d’accord.</p>`},

  {type:'dilemma', title:'Et toi, que conseillerais-tu ?',
   html:`<p>Tu conseilles un petit pays européen qui n’a ni usine de puces ni grand cloud. Ses hôpitaux, ses écoles et ses entreprises utilisent de plus en plus l’IA.</p>`,
   opts:[
    {t:'S’aligner sur les États-Unis : mêmes restrictions, mêmes fournisseurs.', out:'<p><b>Ce que tu gagnes :</b> l’accès aux meilleures puces et aux meilleurs modèles.</p><p><b>Ce que tu risques :</b> des représailles commerciales chinoises, et une dépendance complète à des décisions prises à Washington.</p>'},
    {t:'Commercer avec tout le monde et ne choisir aucun camp.', out:'<p><b>Ce que tu gagnes :</b> des prix plus bas et plusieurs fournisseurs.</p><p><b>Ce que tu risques :</b> chaque camp peut te couper l’accès à ses technologies si tu commerces avec l’autre. La neutralité devient difficile quand les règles américaines s’appliquent aussi aux produits fabriqués ailleurs.</p>'},
    {t:'Investir, avec ses voisins, dans une chaîne européenne.', out:'<p><b>Ce que tu gagnes :</b> davantage d’autonomie à long terme.</p><p><b>Ce que tu risques :</b> des dizaines de milliards d’investissement, dix ans de retard à rattraper, et aucune garantie de réussir. Même TSMC dépend d’ASML, qui dépend elle-même de fournisseurs du monde entier.</p>'}],
   keep:'<p><b>À retenir :</b> il n’existe pas d’option sans coût. Dans une chaîne aussi concentrée, la question n’est pas d’être indépendant, mais de choisir de qui l’on accepte de dépendre.</p>'},

  {type:'mcq', pts:10, title:'L’idée du dossier',
   q:'Quelle phrase résume le mieux ce que tu viens de voir&nbsp;?',
   opts:[
    {t:'Personne ne maîtrise toute la chaîne de l’IA : chaque maillon dépend des autres, et chaque maillon peut devenir un moyen de pression politique.',ok:true},
    {t:'Les États-Unis contrôlent toute la chaîne, de la mine au chatbot.',why:'Ils dépendent de Taïwan, des Pays-Bas et des métaux chinois.'},
    {t:'La Chine contrôle toute la chaîne grâce aux terres rares.',why:'Elle n’a pas accès aux machines et aux puces les plus avancées.'},
    {t:'L’IA est un logiciel : la géographie n’a aucune importance.',why:'L’IA repose sur du matériel fabriqué dans quelques lieux précis.'}],
   exp:`<p>Les puces sont devenues un enjeu de puissance, comme le pétrole au 20<sup>e</sup> siècle. Les entreprises (Nvidia, TSMC, ASML, les GAFAM) et les États (États-Unis, Chine, Pays-Bas, Taïwan) y sont étroitement liés.</p>`}
  ],
  notes:[
   '<b>ASML</b> (Pays-Bas) est le seul fabricant des machines EUV. <b>TSMC</b> (Taïwan) fabrique environ 90 % des puces les plus avancées. <b>Nvidia</b> (États-Unis) conçoit environ 80 % des puces d’IA mais ne les fabrique pas.',
   '<b>Microsoft, Amazon, Google</b> possèdent les centres de données (le cloud). <b>OpenAI</b> (ChatGPT) et <b>Anthropic</b> (Claude) entraînent les modèles et louent cette puissance. GAFAM = Google, Apple, Facebook (Meta), Amazon, Microsoft.',
   '<b>Accords circulaires</b> : les fournisseurs investissent dans leurs clients, qui leur achètent leurs produits (Microsoft et OpenAI, Amazon et Anthropic, Nvidia et les deux).',
   '<b>Goulet d’étranglement</b> : un point unique dont dépend toute la chaîne, comme TSMC à Taïwan.',
   'États-Unis et Chine s’affrontent par contrôles à l’exportation : puces et machines d’un côté (2019, 2022), gallium, germanium et terres rares de l’autre (2023, 2025).',
   '<b>Interdépendance</b> : chaque camp tient quelque chose dont l’autre a besoin. Les arguments : sécurité nationale, liberté du commerce, risque de perdre un marché, dépendance de l’Europe.']
};
